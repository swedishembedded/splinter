[package]
name = "splinter-voice-loop"
description = "Can a persona be talked to and talk back, and what does each stage of the loop cost and lose?"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "voice_loop"
path = "src/lib.rs"

[[bin]]
name = "voice-loop"
path = "src/main.rs"

[dependencies]
splinter-sdk = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
