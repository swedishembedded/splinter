[package]
name = "splinter-agent-loop"
description = "Can a locally served model complete a repository task unaided, with every step recorded well enough for a supervisor to audit and reproduce it?"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-loop"
path = "src/main.rs"

[dependencies]
splinter-sdk = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
