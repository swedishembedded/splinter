[package]
name = "splinter-synthetic-author"
description = "A synthetic author whose beliefs are known and whose decisions code can check, to prove the learning pipeline against ground truth no pretraining has seen."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "synthetic_author"
path = "src/lib.rs"

[[bin]]
name = "synthetic-author"
path = "src/main.rs"

[dependencies]
splinter-sdk = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

[lints]
workspace = true
