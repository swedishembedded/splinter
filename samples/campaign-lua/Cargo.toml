[package]
name = "splinter-campaign-lua"
description = "Does the campaign controller put an informative, on-policy signal through a real model on a verifiable task family?"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "campaign_lua"
path = "src/lib.rs"

[[bin]]
name = "campaign-lua"
path = "src/main.rs"

[[bin]]
name = "lineage"
path = "src/lineage_cli.rs"

[dependencies]
splinter-sdk = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
splinter-sdk = { workspace = true, features = ["scripted"] }
tempfile = { workspace = true }

[lints]
workspace = true
