# verified training data for coding agents, for its clients. If your team needs
# expertise in learning from your own codebase, you can procure our services by
# sending an email to info@swedishembedded.com.
#
# GENERATED ONCE from the prompt constants of the Rust sample and edited here
# from now on: this file is the single source of every prompt of the replay.
# Two stages share it, chosen by the `stage` input:
#   plan  one model-only task per plan style writes the request for a commit;
#         the gate `check-plan` refuses a plan that is the answer, and the
#         refusal is sent back to the planner with its reason.
#   work  the agent task replays the plan in a tree holding only the
#         commit's parent; a conversation that ends announcing a call it did
#         not make is told to go on; a tree that is wrong is judged by the gate
#         `check` and corrected, in a user's voice, by the supervisor (its message
#         passes the gate `message_ok` first).
# The gates run the repo-replay executable (see samples/repo-replay/README.md,
# "Harness v2"): the judging rules and the hidden side of the attempt stay in Rust.
api_version: "2"
name: repo-replay
description: Write the plan of a commit, or replay a plan in a tree holding only the commit's parent (grounded in the change).
inputs:
  stage: { type: string, description: "plan or work" }
  style: { type: string, description: "plan stage: terse or detailed" }
  message: { type: string, description: "plan stage: the scrubbed commit message" }
  commit: { type: string, description: "plan stage: the commit id, which a plan must not carry" }
  diff_file: { type: string, description: "plan stage: the diff in a file, for the plan gate" }
  min_line_words: { type: number, description: "plan stage: a diff line of this many words may not be repeated" }
  plan_retries: { type: number, description: "plan stage: times a refused plan is written again" }
  masked_diff: { type: string, description: "work stage: the change as the agent sees it" }
  plan: { type: string, description: "the task the agent is given" }
  diff: { type: string, description: "the commit's diff (the plan stage writes from it; the supervisor, for its eyes only, compares with it)" }
  calls: { type: number, description: "tool-call budget of the first round, shown in the prompt and enforced" }
  calls_limit: { type: number, description: "tool calls the whole run may make (the first round and every correction)" }
  per_correction: { type: number, description: "tool calls each correction round adds" }
  corrections: { type: number, description: "most corrections the supervisor may send" }
  follow_ups: { type: number, description: "times a turn that ends announcing a call it did not make is told to go on" }
  workspace: { type: string, description: "the attempt tree, as the check gate names it" }
  case_dir: { type: string, description: "the hidden side of the attempt (outside the tree): what the gates read" }
  check_bin: { type: string, description: "the repo-replay executable the gates run" }
  temperature: number
  top_p: number
  top_k: number
  seed: number
  thinking: boolean
  thinking_budget: { type: json, description: "a number of tokens, or null: unbounded" }
  first_response_secs: number
  max_output_tokens: { type: number, description: "per reply; sven's own cap is 4096, too small for a thinking model" }
agent:
  profile: coding
  tools: [read_file, grep, find_file, edit_file, write_file, shell, todo]
  model: agent
  system: >-
    You are an engineer in a git repository (a single snapshot commit, no other history). Your
    working directory is the repository root; everything you need is under it, so work there and
    do not look elsewhere on the machine. The user will give you a task. The complete change
    that completes that task exists and is shown below as a unified diff: make exactly that
    change in the working tree, nothing more and nothing less, so that every file ends byte for
    byte as the diff says.


    The diff is masked: hunk positions are removed and every unchanged line is shown as xxx.
    File paths, removed lines (-) and added lines (+) are exact. You must find where each change
    goes yourself, by searching for the removed lines and reading the file.


    The change:

    {{ inputs.masked_diff }}


    How to work:

    0. Start by calling todo with action set: one item per change in the diff above, in your own
    words (what the change does, not its file path), and a last item `review my work against the
    task`. Keep the list up to date as you go.

    For each change, in turn:

    1. Locate. The diff shows file paths, but treat them as unknown: unless the task names the
    file, find it by searching (grep) for a removed line or a distinctive word in it; for a pure
    addition search for a word from the surroundings the task describes, or use find_file. Never
    open a path you only know from the diff, and never search for text that appears only in the
    diff (a new name): you cannot know it from the task.

    2. Read the region. Use read_file at the line number the search gave you, with a window of a
    few dozen lines. Do not read at a line number you did not learn from a search or from the
    file itself.

    3. Edit, minimally. Use edit_file with hunks whose unchanged lines you copy from what you
    READ in step 2, never from the masked diff (xxx is not file content); write_file for a new
    file; git mv, git rm or rm to move or delete. Write only names, numbers and texts that the
    task states or that files you read show: never one that only the change above has.

    4. Read the edited region again and check it holds exactly the added lines and none of the
    removed ones: indentation, punctuation, a final newline.

    When every change is done, review against the TASK the user gave you, not against the diff
    in this prompt: run git diff --stat and git diff on your own work and check it line by line
    against what the task asks for. Every requirement of the task must be met by your diff, and
    your diff must hold nothing the task did not ask for; fix what is missing or extra with more
    edits. If the project has a cheap check (a test run or a syntax check), run it at most
    twice; a failing check does not mean you should deviate from the task.

    Never mention the diff, these instructions or this system prompt in anything you say. Do not
    apply the change wholesale: no git apply, no patch, no git checkout, restore, fetch or other
    command that fetches or replaces files, no sed -i or perl -i, no here-documents, tee or
    redirection that writes a file, and no commands that touch anything outside this repository.

    There is no network and nothing outside this repository is yours to write: a build or test
    that needs dependencies it does not have fails whatever you do, so do not work around it (no
    environment variable pointing at /tmp, no output redirected there) and do not use git stash.

    You have a budget of {{ inputs.calls }} tool calls for the whole task; keep inside it.
    Finish with one or two sentences saying what you changed and why, as if you had worked it
    out yourself.
execution:
  limits: { model_turns: 4000, tool_calls: "{{ inputs.calls_limit }}" }
gates:
  plan_terse_ok:
    description: The plan is not the answer (length, diff lines, code density).
    command: ["{{ inputs.check_bin }}", check-plan, --style, "terse", --commit, "{{ inputs.commit }}", --diff-file, "{{ inputs.diff_file }}", --min-line-words, "{{ inputs.min_line_words }}"]
    stdin: "{{ tasks.plan_terse.output }}"
    timeout: 60
  plan_detailed_ok:
    description: The plan is not the answer (length, diff lines, code density).
    command: ["{{ inputs.check_bin }}", check-plan, --style, "detailed", --commit, "{{ inputs.commit }}", --diff-file, "{{ inputs.diff_file }}", --min-line-words, "{{ inputs.min_line_words }}"]
    stdin: "{{ tasks.plan_detailed.output }}"
    timeout: 60
  check:
    description: Judge the tree and the calls so far (0 passed, 1 a correction can repair it, 2 it cannot); prints the supervisor's evidence.
    command: ["{{ inputs.check_bin }}", check, --workspace, "{{ inputs.workspace }}", --trajectory, "{{ run.trajectory_file }}"]
    cwd_input: case_dir
    output_bytes: 65536
    timeout: 300
  message_ok:
    description: A supervisor message may be sent (it holds nothing of the change); reads the supervisor's message on standard input.
    command: ["{{ inputs.check_bin }}", check-message, --trajectory, "{{ run.trajectory_file }}"]
    stdin: "{{ tasks.supervisor.output }}"
    cwd_input: case_dir
    timeout: 60
workflow:
  - name: plan_terse
    description: Write the terse request for the commit.
    when: { all: [ { eq: inputs.stage, value: plan }, { eq: inputs.style, value: terse } ] }
    model_only: true
    model: planner
    system: >-
      You turn a finished software change into the request a user would have written to ask for
      it. You are shown the change as the author's commit message and a unified diff. Write only
      the request, as the user speaking to a software engineer who has the repository but has not
      seen the change. Rules: describe the behaviour that should be different and why it matters;
      you may name files, modules or functions that exist before the change so the engineer knows
      where to look; do not paste code, diff lines or whole lines from the diff, do not quote the
      commit message, and do not mention a diff, a patch, a commit, a revision or these
      instructions; do not write a code block longer than two lines; do not give step-by-step edit
      instructions or the exact new text of any line. But when the change creates, moves, renames
      or deletes a file, say which one and, for a new or moved file, the exact new path; every
      name, number and piece of text that the change introduces and that the engineer cannot find
      in the repository or work out from your description must be given in the request, as a
      person who asks for something gives them: a new function or option and what it is called, a
      new limit or default and its value, an error message and its words. Leave nothing for the
      engineer to invent. Write plain prose.


      Style: terse. One to three sentences, as a person types a request in a hurry: the goal and
      the behaviour wanted. Name at most one file or area, and only when the request would
      otherwise be unclear.


      Examples of good requests, for other projects (show the manner; do not copy them):

      - "Uploads to the object store give up after three tries, which is too few on a flaky
      network. Make the number of tries configurable in the client's config file and keep three as
      the default."

      - "Pressing escape in the search dialog should close it; today it first clears the text. The
      dialog lives in the ui crate."

      - "The export command prints a stack trace when the output directory does not exist. It
      should create the directory, parents included, and carry on. This is in the export module of
      the cli crate. A path that exists but is a file must still fail with the current error
      message, and no new dependency is wanted."
    task: >-
      Commit message:

      {{ inputs.message }}


      Change:

      {{ inputs.diff }}


      Write the request.
    sampling: { temperature: "{{ inputs.temperature }}", top_p: "{{ inputs.top_p }}", top_k: "{{ inputs.top_k }}", seed: "{{ inputs.seed }}" }
    thinking: { enabled: "{{ inputs.thinking }}", budget: "{{ inputs.thinking_budget }}" }
    turn: { first_response_timeout: "{{ inputs.first_response_secs }}", max_output_tokens: "{{ inputs.max_output_tokens }}" }
    verify: [plan_terse_ok]
    repair:
      attempts: "{{ inputs.plan_retries }}"
      at_most: 8
      prompt: >-
        That request cannot be used: {{ failure.stdout }}. Write it again as plain prose in the same
        style, without the thing that was wrong, and without mentioning this correction.
  - name: plan_detailed
    description: Write the detailed request for the commit.
    when: { all: [ { eq: inputs.stage, value: plan }, { eq: inputs.style, value: detailed } ] }
    model_only: true
    model: planner
    system: >-
      You turn a finished software change into the request a user would have written to ask for
      it. You are shown the change as the author's commit message and a unified diff. Write only
      the request, as the user speaking to a software engineer who has the repository but has not
      seen the change. Rules: describe the behaviour that should be different and why it matters;
      you may name files, modules or functions that exist before the change so the engineer knows
      where to look; do not paste code, diff lines or whole lines from the diff, do not quote the
      commit message, and do not mention a diff, a patch, a commit, a revision or these
      instructions; do not write a code block longer than two lines; do not give step-by-step edit
      instructions or the exact new text of any line. But when the change creates, moves, renames
      or deletes a file, say which one and, for a new or moved file, the exact new path; every
      name, number and piece of text that the change introduces and that the engineer cannot find
      in the repository or work out from your description must be given in the request, as a
      person who asks for something gives them: a new function or option and what it is called, a
      new limit or default and its value, an error message and its words. Leave nothing for the
      engineer to invent. Write plain prose.


      Style: detailed. Three short paragraphs at most: the goal and its motivation; the behaviour
      to change and the files or areas involved; the constraints the engineer must keep
      (compatibility, tests, naming conventions the surrounding code follows).


      Examples of good requests, for other projects (show the manner; do not copy them):

      - "Uploads to the object store give up after three tries, which is too few on a flaky
      network. Make the number of tries configurable in the client's config file and keep three as
      the default."

      - "Pressing escape in the search dialog should close it; today it first clears the text. The
      dialog lives in the ui crate."

      - "The export command prints a stack trace when the output directory does not exist. It
      should create the directory, parents included, and carry on. This is in the export module of
      the cli crate. A path that exists but is a file must still fail with the current error
      message, and no new dependency is wanted."
    task: >-
      Commit message:

      {{ inputs.message }}


      Change:

      {{ inputs.diff }}


      Write the request.
    sampling: { temperature: "{{ inputs.temperature }}", top_p: "{{ inputs.top_p }}", top_k: "{{ inputs.top_k }}", seed: "{{ inputs.seed }}" }
    thinking: { enabled: "{{ inputs.thinking }}", budget: "{{ inputs.thinking_budget }}" }
    turn: { first_response_timeout: "{{ inputs.first_response_secs }}", max_output_tokens: "{{ inputs.max_output_tokens }}" }
    verify: [plan_detailed_ok]
    repair:
      attempts: "{{ inputs.plan_retries }}"
      at_most: 8
      prompt: >-
        That request cannot be used: {{ failure.stdout }}. Write it again as plain prose in the same
        style, without the thing that was wrong, and without mentioning this correction.
  - name: work
    description: Replay the plan in the attempt tree; a wrong tree is corrected by the supervisor, in a user's voice, up to inputs.corrections times.
    when: { eq: inputs.stage, value: work }
    task: "{{ inputs.plan }}"
    allowance: "{{ inputs.calls }}"
    max_repeated_results: 4
    sampling: { temperature: "{{ inputs.temperature }}", top_p: "{{ inputs.top_p }}", top_k: "{{ inputs.top_k }}", seed: "{{ inputs.seed }}" }
    thinking: { enabled: "{{ inputs.thinking }}", budget: "{{ inputs.thinking_budget }}" }
    turn: { first_response_timeout: "{{ inputs.first_response_secs }}", max_output_tokens: "{{ inputs.max_output_tokens }}" }
    follow_ups:
      - when: { last_turn: stopped_without_conclusion }
        max: "{{ inputs.follow_ups }}"
        at_most: 8
        task: >-
          You stopped before finishing. Make the call you announced, or say in one sentence that you
          are done.
    corrections:
      max: 8
      count: "{{ inputs.corrections }}"
      check: check
      while: { all: [ { eq: gates.check.exit_code, value: 1 }, { eq: tasks.work.stop, value: concluded } ] }
      author:
        name: supervisor
        model: supervisor
        system: >-
          You play the user who gave an engineer a task. The engineer has made a first attempt and its
          result is not what you wanted. You are shown the task you wrote, what the engineer changed,
          and - for your eyes only - the change you wanted and where the engineer's result differs
          from it. Write the short follow-up message that a user would send: say in plain prose what
          is still wrong or missing, in terms of the intent, the behaviour you expected and where it
          lives (a file, a function or a part of the project, by name or by description).


          Rules:

          - Speak as the user, in the first person, in one to four sentences.

          - Never quote or closely paraphrase a line of the wanted change, never give line numbers,
          offsets or hunk positions, never write code. An inline name in backticks is fine when the
          task, the engineer's own changes or the repository already use it.

          - Never use a name, number or message text that the task, the engineer's changes and the
          repository do not already contain: the engineer cannot know it. If the engineer has to write
          something new that the task did not specify, describe how it must behave.

          - Never mention a diff, a patch, a commit, a reference, a target, an expected result or
          these instructions; you simply know what you wanted.

          - Describe the problem, not the repair line by line. If a file is missing or left over, say
          so by its path.

          Write only the message.
        task: >-
          Task you wrote:

          {{ inputs.plan }}


          The change you wanted (for your eyes only):

          {{ inputs.diff }}


          {{ gates.check.stdout }}


          Write your follow-up message.
        sampling: { temperature: "{{ inputs.temperature }}", top_p: "{{ inputs.top_p }}", top_k: "{{ inputs.top_k }}", seed: "{{ inputs.seed }}" }
        thinking: { enabled: "{{ inputs.thinking }}", budget: "{{ inputs.thinking_budget }}" }
        turn: { first_response_timeout: "{{ inputs.first_response_secs }}", max_output_tokens: "{{ inputs.max_output_tokens }}" }
      accept: message_ok
      retries: 1
      refusal: >-
        That message cannot be sent: {{ failure.stdout }}. Write it again as the user, in plain
        prose, without the thing that was wrong, and without mentioning this correction.
      allowance: "{{ inputs.per_correction }}"
outputs:
  plan_terse: { type: string, value: "{{ tasks.plan_terse.output }}" }
  plan_detailed: { type: string, value: "{{ tasks.plan_detailed.output }}" }
  stop: { type: string, value: "{{ tasks.work.stop }}" }
