[package]
name = "splinter-goal-selection"
description = "Goal-directed selection of learning material: a raw corpus with labelled relevant, irrelevant, outdated, misleading and known sections, and the loop that picks what closes a participant's gaps, compared with reading everything, nothing, or the same words at random."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "goal-selection"
path = "src/main.rs"

[dependencies]
splinter-sdk = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
