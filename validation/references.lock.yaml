#
# The pinned independent references of the validation program (.agents/roadmap/validation-program.md).
# `packages` is the complete oracle environment: every distribution at an exact version and wheel digest,
# installed with --require-hashes --no-deps into target/validation/venv by
# `scripts/conformance/external.py env`, never a dependency of the Rust build. `references` names what each
# oracle relies on: the package, the functions, and the confidence of the reference (high: a mature,
# stable public API; medium: documented but with conventions to state; low: experimental).
schema: splinter.validation-references/v1
python: "3.14"
platform: manylinux x86_64
packages:
  - { name: formulaic, version: "1.2.2", sha256: 0f84ff49e3fc9dc0e68ab08a0a9427874021aa6c558e66b44dc634a35739b09b, license: "MIT" }
