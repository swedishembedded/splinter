references:
  scipy:
    package: scipy
    repository: https://github.com/scipy/scipy
    release: "1.18.1 (the wheel pinned in packages)"
    functions: [scipy.stats.binomtest, scipy.special.comb, scipy.stats.t.ppf, scipy.stats.norm.ppf]
    confidence: high
    conventions: "binomtest two-sided is 'minlike', which equals the doubled tail only at p = 1/2"
  statsmodels:
    package: statsmodels
    repository: https://github.com/statsmodels/statsmodels
    release: "0.15.0 (the wheel pinned in packages)"
    functions: [statsmodels.stats.multitest.multipletests, statsmodels.stats.proportion.proportion_confint]
    confidence: high
    conventions: "multipletests(method='holm') returns adjusted p-values in input order"
  humaneval-pass-at-k:
    package: numpy
    repository: https://github.com/openai/human-eval
    release: "arXiv:2107.03374 section 2.1, equation 1 (the numerically stable form of its estimate_pass_at_k)"
    functions: [numpy.prod, numpy.arange]
    confidence: high
    conventions: "1 - prod(1 - k / arange(n - c + 1, n + 1)); 1.0 when n - c < k"
  numpy-quantile:
    package: numpy
    repository: https://github.com/numpy/numpy
    release: "2.5.5 (the wheel pinned in packages)"
    functions: [numpy.quantile]
    confidence: high
    conventions: "method='nearest': the sorted value at index q * (n - 1) rounded to the nearest, a half-way index to the even one"
  reference-projector:
    package: null
    repository: this repository (validation/oracles/data/sft_projection.py, validation/oracles/data/policy_gradient_groups.py, validation/oracles/data/attempt_pairs.py)
    release: "written from the sft-step, sft-final, policy-gradient, preference and feedback documentation (crates/data/src/views, crates/data/src/trajectory.rs)"
    functions: [sft_step, sft_final, policy_gradient_groups, attempt_pairs]
    confidence: custom
    conventions: "CUSTOM_ORACLE_REQUIRED: no external framework renders an agent trajectory as Splinter's records do; a second implementation in plain loops, from the documented rules, is the independent oracle"
  networkx:
    package: networkx
    repository: https://github.com/networkx/networkx
    release: "3.7 (the wheel pinned in packages)"
    functions: [networkx.is_directed_acyclic_graph, networkx.topological_generations,
      networkx.strongly_connected_components, networkx.descendants]
    confidence: high
  rank-bm25:
    package: rank-bm25
    repository: https://github.com/dorianbrown/rank_bm25
    release: "0.2.2 (the wheel pinned in packages)"
    functions: [rank_bm25.BM25Okapi]
    confidence: medium
    conventions: "its idf has an epsilon floor and counts repeated query terms; Splinter's BM25 is Lucene's, so only rankings under stated equal conventions compare"
