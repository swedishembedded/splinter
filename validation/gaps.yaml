- id: G-DC-23
  source_id: F23
  where: crates/core/src/factory/execution.rs:309
  what: credential_like is a substring test on KEY/TOKEN/SECRET/PASSWORD/CREDENTIAL of env var names. Misses AUTH, BEARER,
    PASSWD, COOKIE, DSN names and any secret under an innocuous name; false positives (MONKEY). Only literal env values
    are checked, never file contents or system_prompt files.
  severity: medium
  confidence: medium
  status: fixed
  resolution: 'the controller''s rule gained PASSWD, AUTH, COOKIE and the provider prefixes (the sandbox''s broader list)
