- id: G-DC-27
  source_id: F27
  where: crates/data/src/views/sft_step.rs:~196 (project_entry any_good path)
  what: A failed or unverified experience with any Good step label is admitted for the default control; Good-labelled actions
    train. docs/limitations and validation.md say sft admits only experiences decided pass (step labels aside); tests cover
