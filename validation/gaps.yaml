schema: splinter.validation-gaps/v1
gaps:
- id: G-DC-01
  source_id: F01
  where: crates/core/src/factory/trial.rs:599
  what: '`(400..499).contains(&s)` is an exclusive range, so HTTP 499 (and any non-4xx/5xx/2xx such as 3xx) never counts
    as a rejected request. A trial whose every request got 499 (client closed request) or 3xx is not classified ModelError(endpoint_rejected)
    and falls through to rule 7-9, possibly graded as the agent''s failure.'
  severity: medium
  confidence: high
  status: fixed
  resolution: 4xx is 400..=499 (7c5bd250; classify spec red for 499 before)
- id: G-DC-02
  source_id: F02
  where: crates/core/src/factory/trial.rs:687
  what: 'metrics() returns an empty map as soon as ONE named metric is out of [0,1]; non-number metrics are skipped with
    `continue`. Silent total loss of shaping metrics: downstream shaped reward then errors ''records no metric'' (loud)
    or, with no shaping configured, produces a Grade with no metrics and no diagnostic that a metric was malformed.'
  severity: medium
  confidence: high
  status: fixed
  resolution: a metric that is no valid measurement makes the trial a verifier error (malformed_reward) instead of a metric-less
    grade (f1c9f50a)
- id: G-DC-03
  source_id: F03
  where: crates/core/src/factory/trial.rs:371
  what: 'reward_of accepts the sole entry of the rewards map whatever its name when the key ''reward'' is absent. A verifier
    that emits only an auxiliary metric (e.g. {''functional_correctness'': 1.0}) is graded as if it were the task reward;
    passed=true if it is 1.0.'
  severity: medium
  confidence: medium
  status: rejected
  resolution: Harbor's own aggregate_reward_dicts takes the sole value of a one-key rewards dict; reward_of's doc says so;
    several keys without reward are already refused
- id: G-DC-04
  source_id: F04
  where: crates/data/src/views/policy_gradient.rs:357 vs crates/core/src/usage.rs:71 and policy_gradient.rs:525
  what: 'The over-length penalty reads completion tokens from evidence /tokens/completion first, then /score/usage/completion_tokens,
    then trajectory totals; TrialReport.completion_tokens/cost come from TokenUsage::of_trial which prefers /score/usage
    over /tokens. Two precedence orders for the same quantity: when both are present and differ, the penalty applied to
    the reward and the token count reported in the manifest disagree, and the report cannot be used to audit the reward.'
  severity: medium
  confidence: high
  status: fixed
  resolution: 'the penalty and the group report read one completion count, one precedence (data: the over-length penalty
    reads the completion count the group report prints)'
- id: G-DC-05
  source_id: F05
  where: crates/core/src/usage.rs:42-44,61
  what: from_score_usage/from_trial_tokens default a missing completion, prompt or cached count to 0. A usage record with
    only prompt_tokens is reported as 0 completion tokens (and cost = prompt) instead of unknown; TrialReport.completion_tokens
    then shows 0 for a trial whose completion count was never measured.
  severity: low
  confidence: high
  status: fixed
  resolution: 'TokenUsage''s counts are Option; cost and processed are absent, never zero, without them (core: a token count
    the score record does not state is unmeasured, never zero)'
- id: G-DC-06
  source_id: F06
  where: crates/data/src/views/rewards.rs:140
  what: Overlong has pub fields and derives Deserialize; penalty() computes `self.max_tokens - self.buffer` unchecked, while
    the invariant buffer<=max_tokens is enforced only by Overlong::new. A manifest/config deserialised with buffer > max_tokens
    underflows u64 (panic in debug, huge soft limit in release => no penalty ever applied). Likewise cost() (usage.rs:87)
    underflows if cached > prompt via Deserialize.
  severity: low
  confidence: medium
  status: fixed
  resolution: Overlong's fields are private and deserialisation goes through new(), which refuses a buffer longer than the
    budget
- id: G-DC-07
  source_id: F07
  where: crates/data/src/views/sft_step.rs:314 and crates/data/src/views/transition.rs:263
  what: admit_unverified() and exposed() are byte-identical definitions of 'exposed' (any Verdict Fail at Strength::Constraint).
    Duplicate sources of truth for the exposure rule; and the rule conflates the exposure audit with ANY constraint-strength
    failure (Strength::Constraint is documented as a general 'rule the work must not break', e.g. invented content). validation.md
    maps 'exposure exclusion' without a mutant.
  severity: high
  confidence: high
  status: fixed
  resolution: 'one rule (views::breaks_a_constraint) for both views that admit undecided attempts; named for what it checks:
    any failed verdict at constraint strength, the exposure audit''s among them, which disqualifies material by design'
- id: G-DC-08
  source_id: F08
  where: crates/data/src/conversation_pg.rs:91 vs crates/data/src/views/policy_gradient.rs:497
  what: 'Second, divergent GroupKind classifier: AllPass iff all rewards >=1.0; AllFail iff no signal and all <=0.0; everything
    else (including a no-signal group of equal 0.5 rewards) is labelled Graded. A group with identical non-extreme rewards
    is reported as Graded (signal=false) here but AllPass/AllFail in PolicyGradient; campaign counts groups by kind so the
    two producers disagree.'
  severity: medium
  confidence: high
  status: fixed
  resolution: GroupKind::of is the one classifier of both policy-gradient projections
- id: G-DC-09
  source_id: F09
  where: crates/data/src/views/policy_gradient.rs:497
  what: kind = AllPass if any trial in a no-signal group passed. With an over-length penalty or shaped rewards a group can
    contain a pass and a fail with equal reward (no signal) and is labelled AllPass although a fail exists; AllFail/AllPass
    drives self-distillation (Distill::Cliff).
  severity: low
  confidence: medium
  status: rejected
  resolution: 'by design, now documented on GroupKind::AllPass: a no-signal group with a pass is not a cliff and is not
    distilled'
- id: G-DC-10
  source_id: F10
  where: crates/data/src/views/policy_gradient.rs:316-326 and crates/data/src/views/attempts.rs:96-102
  what: 'Group/trial identity derivation is implemented twice and differs: PolicyGradient requires /trial AND /task/id together
    (XOR => NoRollout); attempts::verified accepts either independently; policy falls back from /model to provenance.policy
    to provenance.solver; trial falls back to ''attempt-<n>''. The doc claims preference/feedback and policy-gradient name
    the same groups; they diverge for partial evidence. Fallback to solver silently merges different models under one solver
    label; ''attempt-N'' names collide across separate runs of one task/policy, merging unrelated trials into one trial
    (reward mismatch error or silent merge).'
  severity: high
  confidence: high
  status: fixed
  resolution: 'attempts::identify names group and trial for policy-gradient, preference and feedback by one rule. Open:
    attempt-N trial names of separate passes of one task and policy can still merge (provenance carries no pass id)'
- id: G-DC-11
  source_id: F11
  where: crates/data/src/views/policy_gradient.rs:286-340
  what: rollout() picks the deciding verdict's evidence; when the deciding verdict is a Constraint-strength Fail (exposure/audit),
    its evidence carries no /trial,/task,/metrics. A trial that passed executably but failed a constraint audit becomes
    NoRollout (or, under shaped reward with a metrics requirement, a hard ViewError aborting the whole projection) instead
    of a fail-reward member of its group; a sealed/exposed attempt thus vanishes from the baseline silently.
  severity: high
  confidence: medium
  status: fixed
  resolution: 'a constraint-failed attempt is excluded as Failed by every view (no group member, no baseline): contaminated
    material is never training material, the plan''s 6C rule'
- id: G-DC-12
  source_id: F12
  where: crates/data/src/views/rehearsal.rs:46
  what: Rehearsal::record excludes only decisions that are Fail; undecided (no verdict, conflicting top verdicts, infrastructure
    failure) is admitted. Answers from trials whose verdicts conflict, or whose run failed on infrastructure, are replayed
    as 'the model's own good answers' (ungraded treated as acceptable). The view has no test in crates/data.
  severity: medium
  confidence: high
  status: rejected
  resolution: 'documented and specified: a rehearsal record is what the model answered, an ungradeable general request included
    (views/rehearsal.rs module doc, pipelines rehearsal spec). Open as a spec question: an entry with conflicting strongest
    verdicts is admitted too'
- id: G-DC-13
  source_id: F13
  where: crates/data/src/wire.rs:231
  what: episode_lines silently drops records whose tool-call arguments are not JSON objects (`if renderable(&record)`),
    with no counter or error. Training-data loss without accounting; every other view counts exclusions per reason.
  severity: low
  confidence: high
  status: rejected
  resolution: documented contract of episode_lines (wire.rs), its only caller the minimind sample
- id: G-DC-14
  source_id: F14
  where: crates/data/src/lib.rs:384,456 (Projection::with_system_prompt, thinned_to) used from crates/pipelines/src/datasets.rs:412-415
  what: with_system_prompt overwrites the first system message content on Rewarded/Chat records but does not clear or re-check
    outcome.sampled prompt_token_ids; thinned_to/thinned_to_tokens/within_block drop arbitrary records of a policy-gradient
    projection. Exact sampled ids were generated under the original system prompt; rewriting the text leaves ids that no
    longer match the rendered context (brain refuses or trains on mismatched ratios). Thinning drops records (even all records
    of a trial or its baseline_only record) without re-establishing group baselines.
  severity: high
  confidence: medium
  status: fixed
  resolution: 'with_system_prompt: a record whose prompt is replaced drops its sampled ids, counted as prompt_replaced (6d272032);
    thinning (thinned_to, within_block) drops whole records, never ids in part, and is left as is'
- id: G-DC-15
  source_id: F15
  where: crates/data/src/sampled.rs:100-131
  what: 'trace_of validates counts and id range only: logprobs are not checked finite or <=0, prompt_token_ids may be empty,
    completion ids are not checked to end with the end-of-turn marker (doc says ''the end-of-turn marker included''), f64->f32
    truncation unchecked. Importance ratios rest on these numbers; a NaN/+inf/positive logprob or truncated generation would
    be written as ''exact'' sampled tokens.'
  severity: medium
  confidence: high
  status: fixed
  resolution: trace_of refuses NaN, infinite or positive logprobs (ProxyReason::InvalidLogprobs) and an empty prompt (NoTrace)
    (54b11c70); the end-of-turn marker is not enforceable from ids alone, the doc corrected
- id: G-DC-16
  source_id: F16
  where: crates/data/src/holdout.rs:406 and :384-392
  what: record_membership parses side with `.ok()` (unknown side string => free) and treats a record that is not valid JSON
    as an ungrouped, examinable sample; held_out_flags lets an explicit side win over the group's fixed side. Typos in a
    producer's side field or a corrupt line silently become free samples and may split a group across train/held-out; no
    error or count.
  severity: medium
  confidence: medium
  status: fixed
  resolution: an unknown side or a record that is not a JSON object is refused (ViewError::MalformedRecord) (472ce51b)
- id: G-DC-17
  source_id: F17
  where: crates/data/src/overlap.rs:58-70
  what: content_overlaps compares only records with >= min_features features; shorter records are never compared; the leakage
    gate therefore fails open for short records and verify_no_overlap returns Ok. Short test records that duplicate training
    records are not reported; no counter of 'too small to compare' exposed to the caller (test records_in_the_same_part_may_repeat...
    asserts the behaviour but nothing surfaces it in the manifest).
  severity: medium
  confidence: high
  status: fixed
  resolution: short records duplicating each other across parts are reported at similarity 1.0 (d2182b2f)
- id: G-DC-18
  source_id: F18
  where: crates/data/src/dataset.rs:523-532
  what: place_dataset renames the dataset into place and only then writes the manifest with std::fs::write (non-atomic);
    manifest text goes through from_utf8_lossy. A crash between the two leaves a dataset file with no (or truncated) manifest;
    DatasetStore keys by manifest digest so it is unaffected, but a standalone write_dataset path is left inconsistent.
    Also no fsync.
  severity: low
  confidence: medium
  status: fixed
  resolution: the manifest is written to a temporary file and renamed; the lossy UTF-8 pass is gone (a crash between the
    two renames still leaves a dataset without a manifest, which readers refuse loudly)
- id: G-DC-19
  source_id: F19
  where: crates/core/src/digest.rs:199
  what: canonical_json goes through serde_json::to_value, which serialises NaN/inf f64 as null. Two distinct values (a NaN
    reward and None) hash to the same content address; canonical form is also not RFC 8785 (key order by UTF-8 bytes, not
    UTF-16; ryu float spelling) although docs call it canonical.
  severity: low
  confidence: high
  status: rejected
  resolution: 'negligible: no f64 in a content-addressed type reaches the hash; the form is documented and never claimed
    RFC 8785'
- id: G-DC-20
  source_id: F20
  where: crates/data/src/curation.rs:185-215
  what: Pass curation distinct-calls keys on the call list only; passes with no tool calls (pure answers) all have the empty
    call list and collapse to a single pass per task regardless of answer text; 'per action' uses tool-call count (parallel
    calls count separately), not agent steps. Closed-book tasks lose all but one demonstration per task when --distinct-calls
    is used; behaviour is consistent with the doc wording but surprising and untested.
  severity: low
  confidence: medium
  status: rejected
  resolution: 'by design: docs/reference/datasets.md says pure-answer passes are one under --distinct-calls'
- id: G-DC-21
  source_id: F21
  where: crates/data/src/trajectory.rs:194
  what: packed_record picks tools = max action.tools rather than the last action's tool set. Equivalent only while tool
    sets are numbered by first appearance; with a set reused after a different later set, the record carries a set that
    the last action was not offered. (rendering.rs rejects mixed sets for packed, mitigating.)
  severity: low
  confidence: low
  status: rejected
  resolution: 'negligible: packing across mixed tool sets is refused (rendering.rs), so every packed action shares its tools
    index'
- id: G-DC-22
  source_id: F22
  where: crates/core/src/tool_calls.rs:84-107 and crates/data/src/trajectory.rs:413
  what: 'Result-to-call pairing is implemented twice (outputs_by_call with positional/whole-step fallbacks; calls_asked
    id-only). Duplicate logic: ''repeated action'' detection (data) and diagnosis/repository-history (core) can attribute
