- id: G-FS-01
  source_id: F-01
  where: crates/factory/src/run/compute.rs:387,427,440
  what: run_items keeps `done` (the Sender) alive in the scope closure; if an executor panics inside a scope.spawn worker
    the result is never sent and `results.recv()` blocks forever (recv only errors when all senders drop, but the outer
    `done` lives). A panicking operation (e.g. external/agent op) hangs the controller while holding the lease instead of
    failing the stage. The `else { return Ok(()) }` arm after recv is effectively unreachable. Needs catch_unwind or dropping
    the outer sender.
  severity: high
  confidence: medium-high
  status: fixed
  resolution: a panicking item's operation is caught and fails its stage naming the panic (foreach::a_panicking_item_fails_its_stage_and_never_hangs_the_controller;
    seen to hang without the fix)
- id: G-FS-02
  source_id: F-02
  where: crates/factory/src/run/mod.rs:272,324; crates/store/src/factory/runstate/mod.rs:251-300
  what: LEASE_SECONDS=600 and acquire() is called once at Factory::open; grep finds no renewal anywhere in factory. begin_fenced
    checks only owner+token, not expiry, so the first controller keeps writing until another controller acquires. A stage
    longer than 10 min (training, big rollouts) lets a second `resume` acquire the lease (token+1); the first controller
    then fails with StaleFence mid-stage and the work is duplicated. No heartbeat test.
  severity: high
  confidence: high
  status: fixed
  resolution: RunState::renew (fenced, keeps the token) and a heartbeat thread renewing every third of the lease while the
    controller lives (foreach::a_stage_longer_than_the_lease_keeps_it_for_its_controller; seen red without the heartbeat)
- id: G-FS-03
  source_id: F-03
  where: crates/factory/src/run/release.rs:318-322
  what: 'Retention gate defaults missing statistics: alpha=0.05, difference=0.0, losses/wins=0 -> one_sided_p(0,0) is not
    < alpha so the gate becomes Retained. A retention evaluation whose result lacks statistics (failed/skipped/malformed
    result.json) silently passes the retention gate and can promote a regressed candidate. Should be Inconclusive/refused
    when statistics keys are absent.'
  severity: medium
  confidence: medium
  status: fixed
  resolution: the retention gate reads a development plan's sign test or an examiner's one-sided bound, and is inconclusive
    without either; a signed retention verdict was ALWAYS retained before (release::retention_spec)
- id: G-FS-04
  source_id: F-04
  where: crates/factory/src/run/release.rs:337-345
  what: 'purpose_of() `.and_then(params::<EvaluationParams>().ok()).map(..).unwrap_or_default()` maps a missing stage or
    unparsable params to Purpose::Target (the #[default]), so a transfer/retention evaluation that cannot be resolved is
    counted as a target evaluation instead of erroring (and can satisfy `required()`-purpose checks wrongly).'
  severity: medium
  confidence: medium
  status: fixed
  resolution: purpose_of returns an error for an evaluation the plan does not hold or whose parameters do not read
- id: G-FS-05
  source_id: F-05
  where: crates/factory/src/external_op.rs:286-307 (readable includes self.repository), 160-170 (identity = file + `code`
    paths + grant)
  what: Only the operator file and the paths listed in `code` are digested into the stage identity, but the sandbox mounts
    the WHOLE repository read-only (and grant.read paths) and `command[0]` programs that are not ./ are not pinned. An operator
    that reads any repo file not listed in `code`, a granted read path, an interpreter, or a granted env var gets cached
    results that do not invalidate when those change (silent stale product). Also grant.write paths allow non-hermetic side
    effects. Needs adversarial test.
  severity: medium
  confidence: medium
  status: fixed
  resolution: 'an operator''s sandbox reads of the repository only its own file and its code (what its identity pins; external::an_operator_reads_only_what_its_identity_pins),
    plus the top directory of a ./ program outside its code (a repository-kept virtualenv, the machine''s, unpinned like
    PATH: bench''s collection.compile runs ./.venv/bin/python). The operator specs return early without Landlock (G-AS-14)'
- id: G-FS-06
  source_id: F-06
  where: crates/factory/src/run/mod.rs:498; crates/store/src/factory/products/transfer.rs:99-116
  what: Reuse path (Factory::begin -> ensure_view) trusts the committed manifest and the view's manifest.json; it does not
    re-hash blobs (comment says verify_product re-hashes). A corrupted blob/view file is reused silently until someone runs
    `verify`; `if let Ok(..)` also swallows ensure_view errors (corruption, I/O) and falls through to recompute with no
    log, hiding product-store damage.
  severity: medium
  confidence: medium
  status: fixed
  resolution: a reused product is verified (every blob and every view file); an edited view is materialised again from its
    blobs, a rotted blob is refused (store factory_products::a_reused_product_is_its_committed_bytes_or_refused); the controller
    computes afresh only a product that is not committed and propagates every other error
- id: G-FS-07
  source_id: F-07
  where: crates/factory/src/run/compute.rs:378-460 vs crates/core concurrency::fan_out (re-exported crates/orchestrator/src/concurrency.rs)
  what: Two independent bounded-concurrency fan-out implementations (hand-rolled thread::scope+mpsc in factory, fan_out
    in core); different failure/ordering semantics, tested separately.
  severity: medium
  confidence: medium
  status: confirmed
  resolution: 'two bounded fan-outs (factory''s scoped threads, core''s fan_out): one implementation is a Phase 16 cleanup;
    the factory''s now handles a panicking item'
- id: G-FS-08
  source_id: F-08
