- id: G-DC-30
  source_id: F30
  where: crates/data/src/lib.rs:Objective::line_format and views Reward/Contrastive
  what: 'Objectives Reward and Contrastive are written in Splinter''s export format that no trainer reads. Dead-end outputs:
