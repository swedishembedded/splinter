  severity: low
  confidence: medium
  status: fixed
  resolution: the map row now states the refusal of unreadable records; its 'held out whole' is true of groups, and the
    growth to a minimum held-out size is the code's, documented in holdout.rs
- id: G-DC-26
  source_id: F26
  where: crates/data/src/views/policy_gradient.rs:300 (rollout reward check) and :430
  what: Reward consistency across a trial's conversations compares with absolute f64::EPSILON (2.2e-16). Rewards of order
    1 that differ by float noise from recomputation order (shaped sums) raise ViewError; conversely differences below 1e-16
