- id: G-DC-24
  source_id: F24
  where: docs/contributing/validation.md rows 'Verified-only admission, exposure exclusion' and 'Held-out splits'; scripts/conformance/mutants.tsv
  what: Mutants column is empty for admission, exposure, held-out splits, and every data view other than rewards/PG/mask/curation;
