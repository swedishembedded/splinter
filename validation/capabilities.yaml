  crate: workers/harbor
  entry: 'worker environment: SPLINTER_SVEN_BIN, SPLINTER_CLAUDE_BIN, SPLINTER_CODEX_BIN, SPLINTER_GATEWAY_HOST, SPLINTER_CONFINE_BIN,
    XDG_CACHE_HOME (image cache default ~/.cache/splinter-harbor-worker), every token_env named by a connection'
  source: workers/harbor/splinter_harbor_worker/plan.py:agent_binary, gateway_host; runner.py:default_image_cache,_register_models;
    sandbox/choice.py:77
  contract: The worker reads agent binary locations, the gateway host and the credentials named by the specs from its own
    environment, and refuses a spec naming a variable that is unset.
  tests:
  - workers/harbor/tests/test_refusals.py::test_a_variable_the_worker_does_not_have_is_refused
  oracle: n/a
  missing:
  - token_env allowlist (any variable of the worker's environment is readable by a spec) (F1)
  state: SPECIFIED
  risk: high
  tier: cpu
- id: CFG-FACTORY-FILES
  crate: factory
  entry: recipe.yaml, recipe.lock.json, origin.json, manifest.json, stage.json, task.json, items.json, collection.json,
    release.json, result.json; schemas/factory/*.schema.json (10 schemas)
  source: crates/factory/src/recipe.rs; crates/factory/src/graph.rs (deny_unknown_fields at :65,:94,:120); crates/core/src/factory/schemas.rs;
    crates/core/examples/factory-schemas.rs
  contract: The factory's contracts are Rust types with deny_unknown_fields whose JSON Schemas are generated into schemas/factory
    and a test fails when the committed copies differ; the recipe itself has no published schema.
  tests:
  - crates/core/src/factory/schemas.rs (committed-schema equality test)
  - workers/harbor/tests/conftest.py validates reports against splinter.attempt.v1
  oracle: JSON Schema validator (python jsonschema Draft 2020-12 already used by the worker tests)
  missing:
  - no schema for recipe.yaml, connections.yaml, operators.yaml, experiment plan, improve file, eval plan file, harness
    yaml
  - 'round-trip: every schema accepts what the Rust types write and rejects what they refuse (differential test)'
  state: SPECIFIED
  risk: medium
  tier: cpu
- id: CFG-TASK-FILES
  crate: knowledge
  entry: 'task directories: task.toml ([metadata.splinter] schema splinter.harbor.v1, [metadata].bench_sealed), split.toml,
    instruction, tests/, solution/; practice collections'
  source: crates/knowledge/src/tasks/workspace/harbor/mod.rs (toml::Table, loose); crates/factory/src/collection.rs:204-224;
    crates/pipelines/src/episodes/collection.rs
  contract: Harbor-format task.toml is read as a loose TOML table (Harbor owns the schema) with only [metadata.splinter]
    checked against schema splinter.harbor.v1 and Windows or multi-step tasks refused.
  tests:
  - crates/knowledge workspace/harbor tests (not inspected)
  - crates/splinter/tests/it/harbor_episodes_cli.rs
  oracle: Harbor TaskConfig pydantic model (harbor.models.task) as validity oracle
  missing:
  - task.toml validated by Harbor's own loader on import
  - unknown [environment] keys silently ignored
  state: SPECIFIED
  risk: medium
  tier: cpu
- id: CFG-PLANS
  crate: pipelines
  entry: experiment plan TOML (pipelines/experiment/mod.rs:180 toml::from_str), improve file (improve/file.rs deny_unknown_fields),
    eval plan (factory/eval_plan.rs deny_unknown_fields; schema splinter.eval.v1), mutation space (harness_space.rs MutationSpace::parse)
  source: see entry
  contract: Plan and space files are parsed into typed structs; improve and eval plans refuse unknown fields; the experiment
    plan struct carries no deny_unknown_fields so a misspelt key is silently ignored.
  tests:
  - crates/pipelines/src/experiment/tests.rs
  - crates/agent/src/harness_space.rs (4 inline)
  oracle: JSON Schema
  missing:
  - unknown-key refusal test for the experiment plan (F9)
  state: SPECIFIED
  risk: low
  tier: cpu
- id: CFG-HUB-AND-KEYS
  crate: splinter
  entry: --token-file FILE (HF token; hub.rs help names ~/.cache/huggingface/token but no default is read), --brain-key-file,
    --brain-ca-file, --examiner-key FILE
  source: crates/splinter/src/hub_session.rs:hub_of; crates/sdk/src/device.rs; crates/splinter/src/cli/hub.rs:24-26
  contract: Secrets are read from files named by flags (never from flags or the environment), trimmed, and validated as
    header-safe ASCII for the Hub token; without a token the Hub is called anonymously.
  tests:
  - crates/splinter/src/hub_session.rs (not inspected)
  - crates/hub/src/lib.rs validation
  oracle: n/a
  missing:
  - file mode (world-readable token) not checked
  - empty token file error message
  state: SPECIFIED
  risk: medium
  tier: cpu
- id: CFG-BUILD-AND-MAKE
  crate: splinter
  entry: build-time SPLINTER_GIT_REV, SPLINTER_GIT_DIRTY, SPLINTER_RUSTC (option_env!); Makefile vars SVEN_DIR, BRAIN_DIR,
    BRAIN_BIN, SVEN_BIN, SPLINTER_BIN, MODELS_DIR, TEST_THREADS, LEASE_ROOT, GPU_LOCK, PREFIX; scripts/workspace-init.sh
    (WORKSPACE_CACHE, --models-dir, --code); SPLINTER_BRAIN_KEY generated in run.sh
  source: crates/splinter/src/build_info.rs:24; crates/splinter/src/baseline_report.rs:49; Makefile:13-33; scripts/workspace-init.sh:44-47,215
  contract: Build identity and developer-workflow locations come from build env and Makefile variables with the defaults
    listed in hardcoded_paths.
  tests:
  - crates/splinter/src/build_info.rs (inline)
  - scripts/gates/check-no-machine-paths.sh (partial coverage)
  oracle: n/a
  missing:
  - gate scope too narrow (F8)
  state: SPECIFIED
  risk: low
  tier: cpu
