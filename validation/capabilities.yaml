config_files:
- path: $XDG_CONFIG_HOME/splinter/connections.yaml (default ~/.config/splinter/connections.yaml)
  reader: crates/factory/src/connections.rs:Connections::layered via crates/orchestrator/src/config.rs:439
  validation: serde deny_unknown_fields (Connection, Connections); token must be env:NAME; drop_headers limited to anthropic-version,
    anthropic-beta; url unvalidated; missing file = empty
  schema_id: null
- path: <task repository>/connections.yaml
  reader: same parser, layered under the machine file
  validation: same; the doc comment says it holds no credential but the parser does not enforce it
  schema_id: null
- path: $XDG_CONFIG_HOME/splinter/operators.yaml (default ~/.config/splinter/operators.yaml)
  reader: crates/factory/src/grants.rs:Grants::load
  validation: deny_unknown_fields; schema string must equal splinter.operator-grants/v1; paths absolute; env names [A-Z0-9_];
    missing file = no grants
  schema_id: splinter.operator-grants/v1 (string in file, no JSON Schema file)
- path: recipe.yaml (task repository) and <run>/recipe.lock.json, origin.json
  reader: crates/factory/src/recipe.rs, run/mod.rs:65-71
  validation: typed stage structs with deny_unknown_fields (graph.rs); validate command reports all problems at once
  schema_id: null
- path: ExecutionSpec JSONL (--specs)
  reader: workers/harbor/splinter_harbor_worker/spec.py:parse_specs
  validation: pydantic _Strict models; plus Rust types core/src/factory/execution.rs deny_unknown_fields
  schema_id: splinter.execution/1 (schemas/factory/splinter.execution.v1.schema.json)
- path: AttemptReport JSON (worker output)
  reader: crates/core/src/factory (attempt types)
  validation: Rust types + generated JSON Schema; worker tests validate against it
  schema_id: splinter.attempt/1 (schemas/factory/splinter.attempt.v1.schema.json)
- path: schemas/factory/*.schema.json (attempt, candidate, dataset, eval, execution, items, operation, stage v2, tasks,
    trial)
  reader: generated by crates/core/examples/factory-schemas.rs
  validation: test fails when committed copy differs from the Rust types
  schema_id: splinter.<name>.v1 / stage.v2
- path: task.toml, split.toml in task directories (Harbor format)
  reader: crates/knowledge/src/tasks/workspace/harbor/mod.rs; crates/factory/src/collection.rs; crates/pipelines/src/episodes/collection.rs
  validation: loose toml::Table; [metadata.splinter].schema must equal splinter.harbor.v1; windows/multi-step refused
  schema_id: splinter.harbor.v1 (metadata block only)
- path: experiment plan TOML (splinter experiment check PLAN)
  reader: crates/pipelines/src/experiment/mod.rs:180
  validation: typed toml::from_str, no deny_unknown_fields found
  schema_id: null
- path: improve file (splinter improve)
  reader: crates/pipelines/src/improve/file.rs
  validation: deny_unknown_fields, tagged kinds
  schema_id: null
- path: eval plan (splinter eval RUN --plan PLAN)
  reader: crates/factory/src/eval_plan.rs
  validation: deny_unknown_fields
  schema_id: splinter.eval.v1
- path: sven harness YAML (attempt harness, harness.search baseline, mutation space)
  reader: crates/agent/src/attempt_harness.rs:check; harness_call.rs:check; harness_space.rs:MutationSpace::parse
  validation: compiled by sven's harness compiler; mutation space parsed by serde_yaml
  schema_id: null
- path: ~/.splinter (state root; legacy ~/.sven/splinter), --state DIR
  reader: crates/store/src/lib.rs:StateRoot::under_home
  validation: directory existence only
  schema_id: null
- path: $XDG_DATA_HOME/brain/models (default ~/.local/share/brain/models)
  reader: crates/orchestrator/src/config.rs:433
  validation: checkpoint dir must hold config.json (generation.rs:125)
  schema_id: null
- path: --token-file (HF token), --brain-key-file, --brain-ca-file, --examiner-key
  reader: crates/splinter/src/hub_session.rs:hub_of; crates/sdk/src/device.rs
  validation: token trimmed, ASCII graphic only, non-empty
  schema_id: null
- path: ~/.cache/splinter-harbor-worker (image cache) and $XDG_CACHE_HOME
  reader: workers/harbor/splinter_harbor_worker/runner.py:default_image_cache
  validation: none
  schema_id: null
- path: environment variables
  reader: 'orchestrator config.rs (HOME, XDG_CONFIG_HOME, XDG_DATA_HOME, PATH, SPLINTER_HARBOR_WORKER, DOCKER_*, DEFAULT_ENV_ALLOWLIST,
    SLURM_*, SLURM_TMPDIR, SNIC_TMP, LOCAL_SCRATCH, connection token vars via credential()); worker plan.py (SPLINTER_SVEN_BIN,
    SPLINTER_CLAUDE_BIN, SPLINTER_CODEX_BIN, SPLINTER_GATEWAY_HOST, SPLINTER_CONFINE_BIN); sandbox tagged.rs writes SPLINTER_RUN;
    build SPLINTER_GIT_REV/DIRTY/RUSTC. NOTE: no BRAIN_* or SPLINTER_* variable configures the Rust binary: everything else
    is a flag'
  validation: empty values ignored for Config vars; no allowlist for connection token variables
  schema_id: null
