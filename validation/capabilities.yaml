#
# The capability inventory of the validation program (.agents/roadmap/validation-program.md, Phase 0):
# one row per capability, read from source. `state` is strict: a test of an implementation against
# itself is SPECIFIED; GOLDEN_PASS needs an independent reference; ADVERSARIAL_PASS a killed mutant.
schema: splinter.validation-capabilities/v1
capabilities:
- id: DATA-REWARD-STRICT-SHAPED
  crate: splinter-data
  entry: RewardShape::{unshaped,shaped}; CLI policy-gradient reward flags
  source: crates/data/src/views/rewards.rs:RewardShape::verdict_reward
  contract: A pass earns 1.0; a failure earns fail_ceiling*sum(w_i*m_i) with ceiling in [0,1), weights finite non-negative
    summing to 1 within 1e-9, metrics in [0,1] or the projection errors.
  tests:
  - crates/data/tests/it/policy_gradient/mod.rs::a_failed_trial_is_rewarded_by_the_shaped_metrics_below_the_ceiling
  - ::without_shaping_a_failure_earns_nothing
  - ::a_configured_metric_a_failed_trial_lacks_is_an_error_naming_it
  - ::a_metric_outside_zero_to_one_is_an_error
  - ::reward_shapes_that_could_not_rank_a_pass_first_are_refused
  - crates/data/src/views/rewards.rs::a_pass_earns_one_and_only_a_spread_of_two_or_more_rewards_signals
  - 'mutants: pass-earns-zero, shaped-reward-sign-reversed'
  oracle: hand-derived rational values (in-test) + independent Python Fraction generator for a metric grid
  missing:
  - NaN/inf/negative metric from JSON (serde_json cannot hold NaN; string metric '0.5' rejected)
  - weights summing to 1 with tolerance edge (1+1e-9, 1+2e-9)
  - pass with metrics present but out of range (not validated - pass short-circuits)
  - 'property test: shaped failure reward < 1 and >= 0 for all legal inputs'
  state: ADVERSARIAL_PASS
  risk: high
  tier: cpu
- id: DATA-REWARD-PARTIAL-CREDIT
  crate: splinter-data
  entry: RewardShape::partial; PartialCredit::earned
  source: crates/data/src/views/rewards.rs:PartialCredit::earned
  contract: A failure earns credit*max(0,(f-floor)/(1-floor)); floor>=1 earns 0; missing floor is measured from 0 and counted
    in groups_without_floor.
  tests:
  - crates/data/src/views/rewards.rs::partial_credit_is_the_share_above_the_naive_floor_scaled_to_the_credit
  - crates/data/tests/it/policy_gradient/shaping.rs::a_failure_earns_partial_credit_above_its_tasks_naive_floor
  - ::a_task_without_a_naive_floor_is_measured_from_zero_and_counted
  - ::partial_credit_is_refused_at_or_above_a_pass_and_a_floor_must_be_a_share
  - 'mutants: naive-floor-ignored, partial-credit-unclamped'
  oracle: hand-derived values (in-test); exact rational enumeration over a grid of (f,floor)
  missing:
  - 'floor lookup keyed by task digest: digest present in floors but verdict digest differs by case/prefix'
  - floors map deserialized from examiner manifest with floor>1 (serde path bypasses RewardShape::partial validation)
  - metric f exactly equal to floor
  state: ADVERSARIAL_PASS
  risk: high
  tier: cpu
- id: DATA-REWARD-OVERLONG-DAPO
  crate: splinter-data
  entry: Overlong::new/penalty; RewardShape::with_overlong
  source: crates/data/src/views/rewards.rs:Overlong::penalty
  contract: Penalty is 0 for n<=L-B, (L-B-n)/B for L-B<n<=L, -1 beyond L; buffer must be in (0,L]; an attempt with no recorded
    completion tokens is a hard error, not zero.
  tests:
  - crates/data/tests/it/policy_gradient/shaping.rs::the_over_length_penalty_is_dapos_soft_ramp
  - ::a_trial_over_the_budget_earns_less_by_the_completion_tokens_it_recorded
  oracle: DAPO paper formula; independent Python ramp table
  missing:
  - boundary tokens exactly L-B, L, L+1
  - 'Overlong built by serde Deserialize (pub fields) with buffer>max_tokens or buffer=0: max_tokens-buffer underflows (panic
    in debug, wrap in release) - see findings'
  - penalty added to a shaped failure can drive reward below 0 (reward range not asserted)
  - source of completion tokens vs TrialReport.completion_tokens agree (they use different precedence)
  state: GOLDEN_PASS
  risk: high
  tier: cpu
- id: DATA-REWARD-SIGNALS-GROUPKIND
  crate: splinter-data
  entry: signals(); PolicyGradient::project group classification
  source: crates/data/src/views/rewards.rs:signals; crates/data/src/views/policy_gradient.rs:project
  contract: A group signals only with >=2 rewards whose max-min >= 1e-12; kind is Graded if signal, else AllPass if any
    trial passed, else AllFail.
  tests:
  - crates/data/tests/it/policy_gradient/mod.rs::a_group_without_a_spread_of_rewards_teaches_nothing
  - crates/data/src/views/rewards.rs::a_pass_earns_one_and_only_a_spread_of_two_or_more_rewards_signals
  - 'mutant: zero-variance-group-kept'
  oracle: exact enumeration of reward vectors
  missing:
  - 'rewards differing by 1e-13 vs 1e-12 (boundary) '
  - shaped rewards with an all-equal group that contains a pass and a fail (overlong penalty equalising them) labelled AllPass
  - NaN reward
  - single-trial group kind
  state: ADVERSARIAL_PASS
  risk: high
  tier: cpu
- id: DATA-PG-GROUPING
  crate: splinter-data
  entry: PolicyGradient::project (factory dataset.project, objective policy-gradient; crates/factory/src/run/dataset/views.rs:view_of)
  source: crates/data/src/views/policy_gradient.rs:PolicyGradient::rollout,project
  contract: A group is the trials of one (task id, task version, policy); each trial counts once however many conversations;
    conversations of a trial must agree on reward else the projection errors.
  tests:
  - policy_gradient/mod.rs::the_conversations_of_one_trial_are_one_rollout_of_its_group
  - ::trials_of_another_task_version_or_another_model_are_other_groups
  - ::an_experience_that_names_no_trial_cannot_be_grouped
  - ::the_report_names_the_task_the_policy_the_rewards_and_what_was_written
  - crates/data/tests/policy_gradient_attempts.rs::attempts_of_one_task_by_one_policy_are_a_group_without_a_trial_name
  - ::two_policies_attempts_at_one_task_are_two_groups
  - 'mutant: groups-merged-across-policies'
  oracle: independent Python grouper over a synthetic verdict corpus
  missing:
  - policy falls back to provenance.policy then provenance.solver silently (two different models under one solver name merge)
  - attempt-N trial names collide across separate runs of the same task/policy
  - trial present but task missing (XOR) -> NoRollout while preference view accepts it
  - constraint-strength fail verdict (exposure) is the deciding verdict and carries no /trial or /metrics
  - conversation reward mismatch uses absolute f64::EPSILON
  - empty task version silently ''
  state: ADVERSARIAL_PASS
  risk: critical
  tier: cpu
- id: DATA-PG-BASELINE-ONLY
  crate: splinter-data
  entry: PolicyGradient::project
  source: crates/data/src/views/policy_gradient.rs:project (baseline loop)
  contract: A written trial none of whose conversations can render still emits one record (instruction only, nothing supervised,
    baseline_only) so brain counts it in the group baseline.
  tests:
  - policy_gradient/shaping.rs::an_attempt_the_view_cannot_render_still_sets_its_groups_baseline
  oracle: independent recomputation of group mean/std with and without baseline records
  missing:
  - trial dropped only by --sampled-only (ProxyTokens) becomes baseline-only
  - trial dropped by only-actions
  - distilled (Teacher) trials never get a baseline record - check intended
  - packed mode baseline
  state: SPECIFIED
  risk: critical
  tier: cpu
- id: DATA-PG-EXACT-TOKENS
  crate: splinter-data
  entry: PolicyGradient::project; sampled_tokens/trace_of
  source: crates/data/src/sampled.rs:trace_of,agreeing,turns_of; crates/data/src/views/policy_gradient.rs:sampled_tokens
  contract: An action carries sven's prompt_token_ids/completion_token_ids/logprobs only if its conversation was read from
    the served requests, was not scrubbed, its step is that action alone, logprob_kind=='policy', counts agree and ids fit
    u32; otherwise it is a counted proxy and carries none.
  tests:
  - policy_gradient/exact_tokens.rs::a_policy_trace_is_written_one_to_one_with_the_action_it_belongs_to
  - ::a_trace_that_is_not_the_policys_own_or_does_not_add_up_is_a_proxy_and_says_why
  - ::a_conversation_the_scrub_would_change_carries_no_ids
  - ::a_conversation_rebuilt_from_its_trajectory_carries_no_ids
  - ::a_context_read_from_requests_keeps_the_text_the_model_was_sent
  oracle: independent Python projector reading ATIF + request log and emitting expected ids; decode ids with the real tokenizer
    and compare to rendered chat template
  missing:
  - non-finite logprob (NaN/+inf) accepted and cast f64->f32
  - prompt_token_ids empty or not a prefix-consistent encoding of the rendered context (no tokenizer round-trip check)
  - completion ids lacking EOS/end-of-turn despite doc claim
  - logprobs > 0
  - tokenizer digest present but different across steps of same trial
  - with_system_prompt rewrite of a record that carries ids
  state: SPECIFIED
  risk: critical
  tier: cpu
- id: DATA-PG-SAMPLED-ONLY
  crate: splinter-data
  entry: PolicyGradient::sampled_only; CLI --sampled-only
  source: crates/data/src/views/policy_gradient.rs:project
  contract: With sampled_only a rewarded record whose actions do not all carry exact sampled turns is left out (ProxyTokens)
    while its trial still sets its group's baseline.
  tests:
  - policy_gradient/exact_tokens.rs::a_build_that_trains_only_sampled_tokens_leaves_every_proxy_action_out_and_says_so
  - 'mutant: sampled-only-ignored'
  oracle: importance-ratio==1 check at first step in brain on emitted records (cross-repo)
  missing:
  - 'a group whose every trial is proxy: all baseline-only?'
  - packed record with one proxy among exact turns
  - Distill::Every combined with sampled_only (ignored)
  state: ADVERSARIAL_PASS
  risk: critical
  tier: cpu
- id: DATA-PG-ADVANTAGE-KIND
  crate: splinter-data
  entry: AdvantageKind::{norm,floor}; Projection.advantage
  source: crates/data/src/views/rewards.rs:AdvantageKind
  contract: Standardised/Positive map to z-score, MeanCentred to mean-centred, LeaveOneOut to leave-one-out; Positive adds
    floor=zero; Splinter writes the name but computes no advantage.
  tests:
  - policy_gradient/mod.rs::the_advantage_kind_names_the_trainers_normalisation_and_writes_every_attempt
  - shaping.rs::positive_writes_every_attempt_and_asks_brain_to_floor_the_advantages_at_zero
  oracle: 'brain''s advantage kernel (cross-repo): compare names/semantics to brain job schema'
  missing:
  - manifest advantage field round-trips through brain's job spec
  - enum spelling parity test against brain's accepted strings
  state: SPECIFIED
  risk: medium
  tier: cpu
- id: DATA-PG-SELF-DISTILL
  crate: splinter-data
  entry: PolicyGradient::distilling(Distill::{Cliff,Every}); view self-distill
  source: crates/data/src/views/policy_gradient.rs:project; crates/data/src/views/privileged.rs:teacher_context
  contract: Attempts of an all-fail group (Cliff) or every attempt (Every) are written with the attempt's own conversation
    plus a teacher context (reference change, failed checks, verifier reason) placed after the first user turn; student
    messages never hold privileged text.
  tests:
  - crates/data/tests/self_distill.rs (5 tests)
  - crates/data/tests/policy_gradient_attempts.rs::an_all_fail_group_is_distilled_with_what_the_workspace_verifier_knows
  - ::an_all_fail_task_that_keeps_nothing_privileged_is_counted
  oracle: 'independent leakage scanner: assert no teacher-context n-gram occurs in student messages'
  missing:
  - privileged text is also in the instruction for tasks whose reference is quoted
  - teacher context for a passed attempt (Every)
  - Distill::Every record has no outcome/reward - brain loader contract
  - bench trials (no workspace verdict) with only verification.reason
  state: SPECIFIED
  risk: high
  tier: cpu
- id: DATA-PG-DATASET-LINE
  crate: splinter-data
  entry: write_dataset / dataset_line (generic-messages-v2 with reward,group,rollout,baseline_only,tokenizer_digest,teacher_context)
  source: crates/data/src/dataset.rs:line,chat_messages
  contract: A policy-gradient chat record is written as one JSON line with messages (each supervised message carrying its
    sampled turn), reward, group, rollout, baseline_only, tokenizer_digest, teacher_context and metadata; supervised count
    must equal sampled turn count.
  tests:
  - policy_gradient/mod.rs::the_dataset_line_carries_the_reward_group_and_rollout_for_brain
  - ::the_records_the_view_writes_keep_brains_training_record_contract
  - ::the_same_corpus_projects_to_the_same_bytes
  - self_distill.rs::the_dataset_line_places_the_teacher_context_after_the_first_user_turn_for_brain
  oracle: brain's own generic-messages-v2 validator/loader run over the emitted file (cross-repo golden); JSON-schema
  missing:
  - byte-for-byte golden line fixture vs brain's published sample
  - reward as f64 shortest repr (e.g. 0.30000000000000004) parsed back by brain
  - rollout key >512 bytes replaced by digest (collision-free?)
  - unknown-field tolerance on brain's side
  state: SPECIFIED
  risk: critical
  tier: cpu
