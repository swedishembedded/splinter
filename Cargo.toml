[workspace]
resolver = "2"
members = ["crates/*", "experiments/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
# A failure outside tests is an error naming what failed, not a panic; an
# invariant that cannot fail is stated with `unreachable!`.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# sven and brain are consumed from their remotes, at the revisions pinned in
# Cargo.lock. A local build against sibling checkouts is a gitignored
# override written by `make local`; it never edits this file or the lock.
#
# Splinter depends on exactly two upstream crates, their public SDKs:
# `sven-sdk` and `brain`. `brain` selects only the surfaces used: `text` for
# chat inference, `study` for fine-tuning, held-out scoring and
# `brain::promote`, whose paired sign test decides a release.
sven-sdk = { git = "https://github.com/swedishembedded/sven" }
brain = { git = "https://github.com/swedishembedded/brain", default-features = false, features = ["text", "study"] }

splinter-lab = { path = "crates/lab" }
splinter-store = { path = "crates/store" }
splinter-policy = { path = "crates/policy" }
splinter-agent = { path = "crates/agent" }
splinter-knowledge = { path = "crates/knowledge" }
splinter-campaign = { path = "crates/campaign" }
splinter-views = { path = "crates/views" }
splinter-sandbox = { path = "crates/sandbox" }
splinter-expdb = { path = "crates/expdb" }

anyhow = "1"
# Content hashing for the experience database.
blake3 = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# Process groups, exit polling and resource limits for bounded process runs.
libc = "0.2"
# Content-defined chunking, so a small edit to a large object re-stores a few chunks.
fastcdc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# Checksums for sealed files and compression of record blocks.
crc32fast = "1"
zstd = "0.13"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
toml = "0.8"
