[workspace]
resolver = "2"
# `samples/agent` only groups the agent samples and is not a package, which
# a `samples/*` glob would take it for; the samples are listed instead.
members = [
    "crates/*",
    "samples/absorb",
    "samples/absorb-story",
    "samples/adams",
    "samples/agent/loop",
    "samples/health",
    "samples/jefferson",
    "samples/lifecourse",
    "samples/persona-chat",
    "samples/repo-replay",
    "samples/synthetic-author",
    "samples/tool-syntax",
    "samples/voice-loop",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
# A failure outside tests is an error naming what failed, not a panic; an
# invariant that cannot fail is stated with `unreachable!`.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# sven and brain are consumed from their remotes, at the revisions pinned in
# Cargo.lock. A local build against sibling checkouts is a gitignored
# override written by `make deps/local`; it never edits this file or the lock.
#
# Splinter depends on exactly two upstream crates, their public SDKs:
# `sven-sdk` and `brain`. `brain` selects only the surfaces used: `text` for
# chat inference, `study` for fine-tuning, held-out scoring and
# `brain::promote`, whose paired sign test decides a release.
sven-sdk = { git = "https://github.com/swedishembedded/sven" }
# sven's trajectory format, the one type of sven's that Splinter's vocabulary
# holds; `sven-sdk` re-exports it, and it depends on no other sven crate.
atif = { git = "https://github.com/swedishembedded/sven" }
brain = { git = "https://github.com/swedishembedded/brain", default-features = false, features = ["text", "study", "timeline", "audio"] }
# A crate of brain beyond the SDK, for the state of the machine the SDK's
# primitives run on: only `splinter-model` uses it.
brain-gpu-core = { git = "https://github.com/swedishembedded/brain" }
# The follower of a release manifest, and the fixtures that write an adapter it
# accepts: a spec of `splinter-model` proves a manifest written here is one the
# server takes.
brain-catalog = { git = "https://github.com/swedishembedded/brain" }
brain-testutil = { git = "https://github.com/swedishembedded/brain" }

splinter-core = { path = "crates/core" }
splinter-eval = { path = "crates/eval" }
splinter-store = { path = "crates/store" }
splinter-model = { path = "crates/model" }
splinter-agent = { path = "crates/agent" }
splinter-knowledge = { path = "crates/knowledge" }
splinter-pipelines = { path = "crates/pipelines" }
splinter-orchestrator = { path = "crates/orchestrator" }
splinter-sdk = { path = "crates/sdk" }
splinter-data = { path = "crates/data" }
splinter-sandbox = { path = "crates/sandbox" }
splinter-expdb = { path = "crates/expdb" }

anyhow = "1"
# Content hashing for the experience database.
blake3 = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# Process groups, exit polling and resource limits for bounded process runs.
libc = "0.2"
# Content-defined chunking, so a small edit to a large object re-stores a few chunks.
fastcdc = "3"
# The JSON schema of a typed call's reply; the version sven's typed calls use.
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a stored document is checked against its address on read, so
# a measured number must parse back to the very same float it was written as.
# The harness optimiser edits sven harness documents (YAML); sven already uses this crate.
serde_yaml = "0.9"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# Checksums for sealed files and compression of record blocks.
crc32fast = "1"
zstd = "0.13"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
toml = "0.8"
regex = "1"

# The longitudinal store reads every episode of a cohort back through its
# sealed, compressed, checksummed blocks; unoptimised, that read dominates the
# timeline specs (about 6 of 7 minutes of one of them), and the timeline fit and
# its scoring are numeric loops. These crates and their codecs are built
# optimised in the dev and test profiles, which changes no behaviour and costs
# only their own compile time.
[profile.dev.package.splinter-expdb]
opt-level = 3
[profile.dev.package.splinter-store]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.brain-horizon]
opt-level = 3
[profile.dev.package.brain-survival]
opt-level = 3
[profile.dev.package.brain-kernels]
opt-level = 3
[profile.dev.package.brain-model]
opt-level = 3
[profile.dev.package.brain-optim]
opt-level = 3
[profile.dev.package.brain-paramstore]
opt-level = 3
[profile.dev.package.brain-gpu-core]
opt-level = 3
[profile.dev.package.brain-data]
opt-level = 3
[profile.dev.package.brain-checkpoint]
opt-level = 3
[profile.dev.package.splinter-model]
opt-level = 3
[profile.dev.package.splinter-core]
opt-level = 3
[profile.dev.package.splinter-data]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.serde]
opt-level = 3
