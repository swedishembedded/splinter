[workspace]
resolver = "2"
# `samples/agent` only groups the agent samples and is not a package, which
# a `samples/*` glob would take it for; the samples are listed instead.
members = [
    "crates/*",
    "samples/absorb",
    "samples/absorb-story",
    "samples/adams",
    "samples/agent/loop",
    "samples/campaign-lua",
    "samples/goal-selection",
    "samples/health",
    "samples/jefferson",
    "samples/model-check",
    "samples/lifecourse",
    "samples/minimind",
    "samples/persona-chat",
    "samples/repo-replay",
    "samples/served-items",
    "samples/synthetic-author",
    "samples/tool-syntax",
    "samples/voice-loop",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.lints.clippy]
# A failure outside tests is an error naming what failed, not a panic; an
# invariant that cannot fail is stated with `unreachable!`.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# sven and brain are consumed from their remotes, at the revisions pinned in
# Cargo.lock. A local build against sibling checkouts is a gitignored
# override written by `make deps/local`; it never edits this file or the lock.
#
# Splinter consumes sven through its public SDK, `sven-sdk`, and brain
# through its API. The `brain` SDK is linked only for the timeline model, whose
# training settings, calibration and synthetic populations brain's API does
# not take yet (a reviewed, temporary exception in architecture.toml).
sven-sdk = { git = "https://github.com/swedishembedded/sven" }
# sven's trajectory format, the one type of sven's that Splinter's vocabulary
# holds; `sven-sdk` re-exports it, and it depends on no other sven crate.
atif = { git = "https://github.com/swedishembedded/sven" }
brain = { git = "https://github.com/swedishembedded/brain", default-features = false, features = ["timeline"] }
# brain's survival evaluation arithmetic (concordance, AUC, Brier score,
# calibration at a horizon, the clustered bootstrap): pure host arithmetic with
# no dependency, the one brain crate a reviewed exception keeps; only
# `splinter-model` links it and re-exports it as `timeline::survival`.
brain-survival = { git = "https://github.com/swedishembedded/brain" }

splinter-core = { path = "crates/core" }
splinter-eval = { path = "crates/eval" }
splinter-store = { path = "crates/store" }
splinter-model = { path = "crates/model" }
splinter-agent = { path = "crates/agent" }
splinter-knowledge = { path = "crates/knowledge" }
splinter-pipelines = { path = "crates/pipelines" }
splinter-orchestrator = { path = "crates/orchestrator" }
splinter-sdk = { path = "crates/sdk" }
splinter-data = { path = "crates/data" }
splinter-sandbox = { path = "crates/sandbox" }
splinter-expdb = { path = "crates/expdb" }
splinter-hub = { path = "crates/hub" }

anyhow = "1"
# Blobs of brain's `/v1/run` calls travel as base64; the version already in the lock.
base64 = "0.22"
# Content hashing for the experience database.
blake3 = "1"
# The examiner's verdict signatures are Ed25519: the promotion gate verifies them with the examiner's public key and holds
# no signing key. BSD-3-Clause, pinned exactly (its checksum in Cargo.lock); the precomputed tables and zeroize are
# signing-side speed and hygiene a verifier does not need.
ed25519-dalek = { version = "=3.0.0", default-features = false }
async-trait = "0.1"
# One GET of an endpoint's model list. The feature sets are sven's own for these two crates
# (TLS through rustls with the ring provider), so the build links one crypto library.
reqwest = { version = "0.13", features = ["rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
# Process groups, exit polling and resource limits for bounded process runs.
libc = "0.2"
# Content-defined chunking, so a small edit to a large object re-stores a few chunks.
fastcdc = "3"
# The JSON schema of a typed call's reply; the version sven's typed calls use.
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a stored document is checked against its address on read, so
# a measured number must parse back to the very same float it was written as.
# The harness optimiser edits sven harness documents (YAML); sven already uses this crate.
serde_yaml = "0.9"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# Checksums for sealed files and compression of record blocks.
crc32fast = "1"
zstd = "0.13"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
toml = "0.8"
regex = "1"

# Line tables only: a panic or backtrace still names file and line, but no
# variable or type information is kept. Full debug info made each test binary
# hundreds of MB and most of its link time. Third-party crates get none at all:
# nobody steps through them, and they are most of every binary. (Tests use
# this profile too.)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The longitudinal store reads every episode of a cohort back through its
# sealed, compressed, checksummed blocks; unoptimised, that read dominates the
# timeline specs (about 6 of 7 minutes of one of them), and the timeline fit and
# its scoring are numeric loops. These crates and their codecs are built
# optimised in the dev and test profiles, which changes no behaviour and costs
# only their own compile time.
[profile.dev.package.splinter-expdb]
opt-level = 3
[profile.dev.package.splinter-store]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.brain-horizon]
opt-level = 3
[profile.dev.package.brain-survival]
opt-level = 3
[profile.dev.package.brain-kernels]
opt-level = 3
[profile.dev.package.brain-model]
opt-level = 3
[profile.dev.package.brain-optim]
opt-level = 3
[profile.dev.package.brain-paramstore]
opt-level = 3
[profile.dev.package.brain-gpu-core]
opt-level = 3
[profile.dev.package.brain-data]
opt-level = 3
[profile.dev.package.brain-checkpoint]
opt-level = 3
[profile.dev.package.splinter-model]
opt-level = 3
[profile.dev.package.splinter-core]
opt-level = 3
[profile.dev.package.splinter-data]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.serde]
opt-level = 3
