#
# A CAD improvement-loop campaign (scripts/campaigns/cad/loop.py). Copy it,
# point the paths at this machine, and run `make campaign/cad/run CONFIG=...`.
# "~" and $VARIABLES expand.

[paths]
work = "~/campaigns/cad"                     # generations, jobs, exports, adapters, logs
dataset_repo = "~/datasets/cad-rl"           # a git repository with scripts/progress.py
# dataset_remote = "<user>/cad-rl"           # also upload it there after every generation
# hf = "~/venv/bin/hf"                       # the uploader
# python = "~/venv/bin/python"               # runs the dataset's scripts/progress.py (needs matplotlib);
#                                            # default: the interpreter running the loop

[serve]
brain = "~/bin/brain"                        # the serving binary (image input for the 27B)
checkpoint = "~/models/Qwen/Qwen3.8-27B-FP8"
models_dir = "~/models"
base_model = "Qwen/Qwen3.8-27B-FP8"          # the model id the base is served as
card = 0
port = 8799
# exam_card = 1                              # a second card: the exam runs beside the exploration
# exam_port = 8800
key_file = "~/keys/brain"
max_batch = 32
env = { BRAIN_BACKEND = "cuda" }
# env_script = "~/bin/cuda-env.sh"           # sourced before brain and the trainer start

[bench]
dir = "~/bench"                              # the benchmark checkout
collection = "tasks/cad"
sven = "~/bin/sven"                          # the agent build every trial runs
roles = ["designer", "reviewer", "specifier", "visual"]
concurrency = 12
explore_attempts = 2                         # training-family attempts per generation
exam_attempts = 2                            # held-out attempts per measured model

[splinter]
binary = "~/bin/splinter"
state = "~/campaigns/cad/state"

[train]
objective = "policy-gradient"                # or "sft-step": imitate the passing attempts of every generation
roles = ["visual", "specifier", "designer", "reviewer"]
images = true                                # records carry the pictures the models were shown
base = "local:Qwen/Qwen3.8-27B-FP8"
base_precision = "bf16"
max_block = 16384
rank = 16
alpha = 32
lr = 5e-5
steps = 80
records_per_step = 4
eval_every = 10
patience = 3
monitor_share = 0.1                          # eval_every, patience, monitor_share: sft-step only
seed = 20261101

[train.reward]                               # policy-gradient: a pass earns 1, a failure fail_ceiling x the weighted metrics
metrics = { iou = 0.5, feature_match = 0.25, deviation_score = 0.25 }
fail_ceiling = 0.5
advantage = "standardised"                   # or "mean-centred"

[train.policy_gradient]                      # brain's clipped objective; the champion's adapter trains on
clip_eps = 0.2
kl_beta = 0.02
reference = "base"                           # the KL anchor: the base, or "start" (the champion)
loss_agg = "seq-mean"
temperature = 1.0                            # the temperature the rollouts were sampled at

[promote]
min_mean_delta = 0.0                         # or require_interval_above_zero = true

# A generation can adopt jobs that already ran (for example the base run):
# [adopt.0]
# explore_job = "~/campaigns/cad/jobs/<job>"
# exam_job = "~/campaigns/cad/jobs/<job>"
