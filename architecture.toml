#
# Splinter's crate layering: the authoritative list of which workspace crate
# may depend on which. scripts/gates/check-architecture.sh enforces it
# against `cargo metadata` in `make check`. AGENTS.md explains the layers;
# when the two disagree, this file wins.
#
# Every workspace package must be listed. `internal` names the Splinter
# crates it may depend on (normal, build and dev dependencies alike).
# `brain` says whether it may depend on brain: only the policy crate may, and
# only on brain's public SDK, the `brain` crate - never an internal
# `brain-*` crate.

[crates.splinter-store]
internal = []

[crates.splinter-sandbox]
# Where a solver's code runs; below knowledge (command capture) and agent
# (the solver's run_code tool), which share its process-running core.
internal = ["splinter-store"]

[crates.splinter-lab]
# Executable verifiers run checks in the environment a task names, through
# the sandbox's one bounded runner rather than a second one of their own.
internal = ["splinter-store", "splinter-sandbox"]

[crates.splinter-policy]
internal = ["splinter-lab"]
brain = true

[crates.splinter-agent]
# splinter-views as a dev-dependency only: the critique-and-retry specs
# check that the chain the repair loop records is what the critic, decision
# and preference views read. The views never depend on the agent. The agent
# runs whatever model it is handed through sven's provider seam, so it does
# not depend on the policy.
internal = ["splinter-store", "splinter-sandbox", "splinter-lab", "splinter-views"]

[crates.splinter-knowledge]
# Model-driven task generators ask their generator model through the
# agent's closed-book solve, the one way a model is run on a task, and hold
# every generated instruction to the views' self-containment rule, the one
# rule for what a student may be shown without the material it lacks.
internal = ["splinter-store", "splinter-sandbox", "splinter-lab", "splinter-policy", "splinter-agent", "splinter-views"]

[crates.splinter-views]
internal = ["splinter-store", "splinter-lab", "splinter-policy"]

[crates.splinter-campaign]
internal = ["splinter-store", "splinter-sandbox", "splinter-lab", "splinter-policy", "splinter-agent", "splinter-knowledge", "splinter-views"]

[crates.splinter]
# The binary is grammar and output: it calls the controller and prints the
# controller's reports, and reaches the store only for the types those
# reports carry.
internal = ["splinter-store", "splinter-campaign"]

[crates.splinter-tool-syntax]
internal = ["splinter-lab", "splinter-policy"]

[limits]
# A source file larger than this is split; the listed exceptions may only
# shrink, and an entry is removed once its file is back under the limit.
max_file_lines = 800
