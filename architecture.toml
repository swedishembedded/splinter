#
# Splinter's crate layering: the authoritative tier of every workspace crate.
# scripts/gates/check-architecture.sh enforces it against `cargo metadata` in
# `make check`; scripts/gates/test-architecture.py is the gate's own
# specification. AGENTS.md explains the layers; when the two disagree, this
# file wins.
#
# Rules:
#   - A crate may depend (as a normal or build dependency) only on crates in a
#     STRICTLY LOWER tier, unless the ordered pair is listed in [[same_layer]].
#     Dev-dependencies are exempt: a test may reach for what production code
#     must not.
#   - A [[forbidden]] pair is a design invariant, not an exception: `to` must
#     not be reachable from `from` over normal dependencies, at any depth. An
#     external crate counts as reached when any crate on the way depends on it.
#   - Every [[same_layer]] and [[allow.large_file]] entry is a REVIEWED,
#     TEMPORARY exception with a `why`. A stale entry (the violation it names
#     no longer exists) is itself a failure: delete it when the underlying
#     issue is fixed.
#   - A declared internal dependency must be named by the crate's sources.
#   - Only the crates in [brain].allowed depend on brain, and only on its
#     public SDK, the `brain` crate - never an internal `brain-*` crate.

[tiers]
# Ordered low -> high.
order = [
    "foundation",  # depends on no other Splinter crate
    "storage",     # state on disk, and the processes tasks run in
    "measurement", # what is measured, and the training data projected from experience
    "domain",      # what is learned from, built on the measurements
    "adapters",    # the only code that talks to sven or to brain
    "application", # composes the domain and the adapters
    "workflow",    # the learning pipelines
    "sdk",         # the one embedding API
    "surface",     # user-visible entry points
    "sample",      # standalone programs; nothing depends on one
]

[crates]
splinter-core = "foundation"
splinter-expdb = "foundation"
splinter-store = "storage"
splinter-sandbox = "storage"
splinter-eval = "measurement"
splinter-model = "adapters"
splinter-agent = "adapters"
splinter-data = "measurement"
splinter-knowledge = "domain"
splinter-orchestrator = "application"
splinter-pipelines = "workflow"
splinter-sdk = "sdk"
splinter = "surface"
splinter-tool-syntax = "sample"
splinter-jefferson = "sample"

[brain]
allowed = ["splinter-model"]

[sven]
# Only the agent runs sven and only the model adapter serves it a provider.
# A caller that drives sven's engine itself does so through the agent module
# the SDK re-exports.
allowed = ["splinter-agent", "splinter-model"]

[surface]
# The command line and every sample depend on the SDK and on nothing else of
# Splinter's: if one needs more, the SDK is missing something.
tiers = ["surface", "sample"]
only = "splinter-sdk"

[limits]
# A source file larger than this is split; a file that must stay larger for a
# while is recorded in [[allow.large_file]], whose size may only shrink.
max_file_lines = 800

[[forbidden]]
from = "splinter-core"
to = "splinter-expdb"
why = "The vocabulary names no storage: a Task or an Experience is the same value whichever database holds it."

[[forbidden]]
from = "splinter-core"
to = "sven-sdk"
why = "The vocabulary names no agent runtime; it holds sven's trajectory format (atif) alone."

[[forbidden]]
from = "splinter-core"
to = "brain"
why = "The vocabulary names no model computation."

[[forbidden]]
from = "splinter-core"
to = "tokio"
why = "The vocabulary performs no I/O and starts no task."

[[forbidden]]
from = "splinter-core"
to = "libc"
why = "The vocabulary starts no process and touches no operating-system interface."

[[forbidden]]
from = "splinter-expdb"
to = "brain"
why = "The experience database is a generic store; it knows neither a model nor a trainer."

[[forbidden]]
from = "splinter-expdb"
to = "sven-sdk"
why = "The experience database is a generic store; it knows neither an agent runtime nor a trajectory."

[[forbidden]]
from = "splinter-store"
to = "brain"
why = "Persistence has no model computation in it."

[[forbidden]]
from = "splinter-sandbox"
to = "brain"
why = "A sandbox runs a solver's code; it has no model computation in it."

[[forbidden]]
from = "splinter-eval"
to = "brain"
why = "Measurement must not be able to reach the model it measures, except through what it is handed."

[[forbidden]]
from = "splinter-agent"
to = "brain"
why = "The agent runs whatever model it is handed through sven's provider seam; brain belongs to the model adapter alone."

[[forbidden]]
from = "splinter-agent"
to = "splinter-model"
why = "The two adapters do not know each other; the controller hands the agent a model."

[[forbidden]]
from = "splinter-model"
to = "splinter-agent"
why = "The two adapters do not know each other; the controller hands the agent a model."

[[forbidden]]
from = "splinter-data"
to = "brain"
why = "A view projects experience into records; which formats a trainer reads, and whether its parser accepts a file, is the model adapter's to say."

[[forbidden]]
from = "splinter-data"
to = "splinter-model"
why = "The model adapter depends on the data crate for the formats it trains, never the reverse."

[[forbidden]]
from = "splinter-knowledge"
to = "sven-sdk"
why = "Intake and task admission ask a model through a proposer they are handed; running it on an agent runtime is the agent adapter's."

[[forbidden]]
from = "splinter-knowledge"
to = "splinter-agent"
why = "The agent adapter depends on knowledge for the shape of a proposal, never the reverse."

[[forbidden]]
from = "splinter-knowledge"
to = "brain"
why = "Intake and task admission have no model computation in them."

[[forbidden]]
from = "splinter-store"
to = "sven-sdk"
why = "Persistence stores sven's trajectory format (atif) and knows nothing of an agent runtime."

[[forbidden]]
from = "splinter-sandbox"
to = "sven-sdk"
why = "A sandbox runs a solver's code; it knows nothing of an agent runtime."

[[forbidden]]
from = "splinter-eval"
to = "sven-sdk"
why = "Measurement reads a trajectory (atif) and knows nothing of an agent runtime."

[[forbidden]]
from = "splinter-data"
to = "sven-sdk"
why = "Training data is projected from a trajectory (atif) and knows nothing of an agent runtime."
