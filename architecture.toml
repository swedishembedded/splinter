#
# Splinter's crate layering: the authoritative list of which workspace crate
# may depend on which. scripts/gates/check-architecture.sh enforces it
# against `cargo metadata` in `make check`. AGENTS.md explains the layers;
# when the two disagree, this file wins.
#
# Every workspace package must be listed. `internal` names the Splinter
# crates it may depend on (normal, build and dev dependencies alike).
# `brain` says whether it may depend on any brain crate: only the policy
# crate may, so the day brain's SDK covers what Splinter needs, one crate
# changes.

[crates.splinter-store]
internal = []

[crates.splinter-lab]
internal = []

[crates.splinter-policy]
internal = ["splinter-lab"]
brain = true
# brain crates reached past brain's public SDK (`brain`). Each entry is a
# surface the SDK does not publish yet; the list may only shrink, and the
# gate refuses both a new internal crate and an entry nothing uses.
brain_internal = [
    "brain-capability",
    "brain-checkpoint",
    "brain-data",
    "brain-gpu-core",
    "brain-model",
    "brain-qwen3",
]

[crates.splinter-agent]
internal = ["splinter-store", "splinter-lab", "splinter-policy"]

[crates.splinter-knowledge]
internal = ["splinter-store", "splinter-lab", "splinter-policy"]

[crates.splinter-campaign]
internal = ["splinter-store", "splinter-lab", "splinter-policy", "splinter-agent", "splinter-knowledge"]

[crates.splinter]
internal = ["splinter-store", "splinter-lab", "splinter-policy", "splinter-agent", "splinter-knowledge", "splinter-campaign"]

[crates.splinter-tool-syntax]
internal = ["splinter-lab", "splinter-policy"]

[limits]
# A source file larger than this is split; the listed exceptions may only
# shrink, and an entry is removed once its file is back under the limit.
max_file_lines = 800
