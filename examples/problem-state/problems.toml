# services by sending an email to info@swedishembedded.com.
#
# The problem state of the experience-to-competence programme on 2026-11-21:
# six diagnosed problems, the candidate interventions against each, the prior
# belief of each with why, and the evidence links. The verdicts already
# recorded are in verdicts.toml; `splinter campaign problems FILE add` seeds a
# campaign's state with this document.

schema = "splinter.problem-state/1"

[parameters]
belief_up = 0.15
belief_down = 0.20
alpha = 0.05
engineering = ["practice.jobs", "practice.harbor"]

[parameters.targets]
"pass@1" = 0.05
"open-book-pass@1" = 0.06
"train-task-coverage" = 0.10

# ---------------------------------------------------------------------------

[[problems]]
id = "overthink"
statement = "Students distilled from a thinking teacher over-think under the 900 s wall-clock agent budget: the training fit turns into timeouts on the exam families."
metric = "pass@1"
evidence = [
    { ref = "knowledge:202", note = "v1 students timed out in 77-84% of exam trials against the base's 21% at the same load" },
    { ref = "knowledge:203", note = "teacher traces for a small student come from non-thinking mode with concise rationales" },
    { ref = "result:item25-E1b", note = "students took 10.7 model turns per trial against the base's 6.5; one turn reasoned 36k characters with no action" },
]

[[problems.candidates]]
id = "overthink.concise-traces"
intervention = "concise-traces"
statement = "Train and examine in the concise trace mode: thinking off, a one- or two-sentence rationale before each tool call."
variable = "practice.profile"
belief = 0.55
prior = "the mechanism is measured (v2 records average 1,474 tokens against v1's 3,140; text per action 14.7 tokens against 392.4; no timeout in any concise harvest); its exam effect is not"
evidence = [
    { ref = "ledger:experience-to-competence#item-25-v2", note = "v2 as trained: 420 concise 27B trajectories" },
    { ref = "result:item24b-harvests", note = "concise harvests 168 x 15 and 168 x 4 per generation had no timeouts" },
    { ref = "ledger:experience-to-competence#e2a", note = "E2a and E2b measure it; not read on 2026-11-21" },
]

[[problems.candidates]]
id = "overthink.drop-unfinished"
intervention = "curation"
statement = "Drop the training records the teacher's own agent limit stopped before a final answer."
variable = "curate.drop_unfinished"
belief = 0.4
prior = "106 of v1's 576 records were cut by the limit and teach acting without concluding; v2 drops them together with the mode change, so its effect is not separated"
evidence = [
    { ref = "knowledge:202", note = "106 of 576 v1 records were stopped by the agent limit" },
]

[[problems.candidates]]
id = "overthink.exam-thinking-budget"
intervention = "serving"
statement = "Examine every arm under an equal per-turn thinking budget (brain's thinking_budget, 2,048 tokens)."
variable = "examine.agent.thinking_budget"
belief = 0.3
prior = "pre-registered as E1c and replaced by the concise mode before any trial; it bounds the symptom at exam time, not what the student learned"
evidence = [
    { ref = "ledger:experience-to-competence#item-25-e1c", note = "E1c pre-registered 09:15, superseded by the concise trace rule at 10:12" },
]

[[problems.candidates]]
id = "overthink.token-turn-budget"
intervention = "instrument"
statement = "E0. Enforce a token and turn budget in the task contract (about 1.5x the base's p90 of passing trials), so a model-caused exhaustion is a fail and wall clock is an infrastructure error; re-examine the base and v1 on the 16 validation tasks at two loads."
variable = "examine.agent.token_budget"
belief = 0.5
prior = "wall-clock limits decided 77-84% of student trials (knowledge 202), so no exam read so far separates the arms from the load; the budget is set offline from existing passing trials and needs the sven total cap and brain's closing thinking budget first"
evidence = [
    { ref = "knowledge:202", note = "wall-clock timeouts decided 77-84% of student trials" },
    { ref = "knowledge:196", note = "the baseline moved 0.04 between time slots" },
    { ref = "ledger:generic-learning#e0", note = "pre-registered success: pass rates agree across loads within the A/A band" },
]

# ---------------------------------------------------------------------------

[[problems]]
id = "kb-unused"
statement = "The 4B policy does not consult a mounted knowledge base: it opens the collection in a few percent of trials and almost never a page of the task's domain."
metric = "open-book-pass@1"
evidence = [
    { ref = "knowledge:191", note = "A2s1 touched /knowledge in 6% of 382 trials and opened no domain page" },
    { ref = "ledger:experience-to-competence#item-21", note = "S0 leakage gate passed; S1 STOP; S1b inconclusive; S1c running" },
]

[[problems.candidates]]
id = "kb-unused.mount-instruction"
intervention = "knowledge-mount"
statement = "Mount the collection and add the grounding instruction to the system prompt."
variable = "practice.profile"
belief = 0.5
prior = "uninformed before S1"
evidence = [
    { ref = "dataset:swedishembedded/knowledge@v0.2", note = "the mounted collection, digest sha256:262ff959..." },
]

[[problems.candidates]]
id = "kb-unused.page-preload"
intervention = "knowledge-mount"
statement = "Preload the task domain's pages into the system prompt instead of relying on the policy to open them."
variable = "practice.profile"
belief = 0.5
prior = "separates 'does not look' from 'cannot use', which S1 could not"
evidence = [
    { ref = "commit:bench-62da1dbb", note = "[sven].knowledge_preload" },
]

[[problems.candidates]]
id = "kb-unused.index-preload"
intervention = "knowledge-mount"
statement = "Preload only the collection's index.md."
variable = "practice.profile"
belief = 0.4
prior = "a weaker form of the page preload: the policy still has to open a page"

[[problems.candidates]]
id = "kb-unused.user-wording"
intervention = "knowledge-mount"
statement = "State the grounding instruction conditionally, in the user's wording."
variable = "practice.profile"
belief = 0.4
prior = "a wording change; S1 showed the policy's habit wins over a system-prompt line"

[[problems.candidates]]
id = "kb-unused.open-book-training"
intervention = "knowledge-mount"
statement = "Train on verified open-book trajectories (S2's views), so reading the collection becomes a habit."
variable = "curate.view"
belief = 0.4
prior = "the plan's S2; untried, and it needs trajectories that read and passed, which S1 found almost none of"
evidence = [
    { ref = "ledger:experience-to-competence#item-21", note = "S2 generation 1 plan" },
]

# ---------------------------------------------------------------------------

[[problems]]
id = "ratio-spikes"
statement = "On-policy RL rounds on real rollouts spiked to importance ratios in the thousands on start-of-run proxy tokens (scrubbed and context-reconstructed actions) and undid the round."
metric = "pass@1"
status = "resolved"
attempts = 2
evidence = [
    { ref = "knowledge:188", note = "rl1 held-out -0.229 [-0.294, -0.159] against A2s1; every spike on a proxy token" },
    { ref = "result:item19-rl1", note = "unguarded round 1 (attempt 1)" },
    { ref = "result:item19-rl1g", note = "guarded rerun (attempt 2): held-out -0.031 [-0.081, +0.018]" },
    { ref = "commit:b879d37d2", note = "dataset build --sampled-only" },
]

[[problems.candidates]]
id = "ratio-spikes.sampled-only"
intervention = "curation"
statement = "Leave every record with a proxy action out of the policy-gradient view (dataset build --sampled-only) and train with recorded behaviour."
variable = "curate.sampled_only"
belief = 0.5
prior = "uninformed before the 24-step diagnostic"

[[problems.candidates]]
id = "ratio-spikes.step-guard"
intervention = "rl-round"
statement = "Skip a step whose KL or gradient norm exceeds a bound (train --max-step-kl, --max-step-grad-norm)."
variable = "train.max_step_kl"
belief = 0.6
prior = "the guarded rerun removed most of the damage on one seed (held-out -0.229 to -0.031) but skipped 13 steps"
evidence = [
    { ref = "knowledge:188", note = "rl1g, single seed" },
]

[[problems.candidates]]
id = "ratio-spikes.dual-clip"
intervention = "rl-round"
statement = "Bound a negative advantage's term by dual-clip PPO (c = 3)."
variable = "train.dual_clip"
belief = 0.5
prior = "specified and gradchecked on CPU; not measured on a GPU training run"
evidence = [
    { ref = "commit:brain-bcd17ba8b", note = "dual clip in brain's shared policy-gradient term" },
    { ref = "commit:db33cd729", note = "splinter train --dual-clip" },
]

# ---------------------------------------------------------------------------

[[problems]]
id = "distill-transfer"
statement = "Distilling the 27B teacher into Qwen3-4B raises the training fit but its transfer to the vim exam families is unproven."
metric = "pass@1"
evidence = [
    { ref = "knowledge:199", note = "the 27B solved 163 of 168 vim practice tasks" },
    { ref = "result:item25-E1b-training-fit", note = "train pass@1 0.265 to 0.497 / 0.446; validation +0.25 [+0.09, +0.42]" },
]

[[problems.candidates]]
id = "distill-transfer.v1-thinking"
intervention = "teacher-distillation"
statement = "SFT on 576 verified 27B trajectories recorded in thinking mode (v1)."
variable = "curate.dataset"
belief = 0.5
prior = "uninformed before E1"
evidence = [
    { ref = "dataset:swedishembedded/vim-headless-mastery-sft@v1", note = "576 records" },
]

[[problems.candidates]]
id = "distill-transfer.v2-concise"
intervention = "teacher-distillation"
statement = "SFT on 420 concise non-thinking 27B trajectories, up to 4 per task with the fewest vim calls (v2)."
variable = "curate.dataset"
belief = 0.55
prior = "removes v1's diagnosed failure (knowledge 202); exam pending in E2b"
evidence = [
    { ref = "dataset:swedishembedded/vim-headless-mastery-sft@v2", note = "420 records, 377 train and 43 held-out" },
    { ref = "ledger:experience-to-competence#item-25-e2b", note = "pre-registered 12:40" },
]

[[problems.candidates]]
id = "distill-transfer.v2-star"
intervention = "star"
statement = "Add the 27B's verified rationalisations of the tasks it never solved to v2 (v2.1)."
variable = "curate.dataset"
belief = 0.4
prior = "waits on v2's exam; the corrected answer check rejects all 30 of the 55 kept 27B attempts lane VSFT's script rejected, plus 2"
evidence = [
    { ref = "knowledge:201", note = "the answer check, corrected" },
]

[[problems.candidates]]
id = "distill-transfer.leave-families-out"
intervention = "teacher-distillation"
statement = "E1. Retrain v1's recipe on the existing teacher traces of two thirds of the 14 vim rungs and examine on the held-out third (three folds, 8 attempts per held-out rung), to measure the champion's held-out-family gain properly."
variable = "curate.holdout_rungs"
belief = 0.4
prior = "v1 is the only arm with a supported held-out gain, but the pooled E1b gain is +0.016 [-0.009, +0.040] on a 14-task exam the base sits at 0.05 on; whether the gain crosses families is unmeasured"
evidence = [
    { ref = "result:item25-E1b", note = "pooled +0.016 [-0.009, +0.040]; 14-task exam, six rungs never passed by any arm" },
    { ref = "ledger:generic-learning#e1", note = "success: pooled held-out-family gain at least +0.05, interval above 0; falsified means breadth is the bottleneck" },
]

[[problems.candidates]]
id = "distill-transfer.min-cost-selection"
intervention = "curation"
statement = "E2. Keep, per task, the verified teacher passes within the student's token budget, lowest total completion tokens first, from the existing 579 passes; native reasoning mode, no instruction text."
variable = "curate.select"
belief = 0.45
prior = "length control by selection replaces the concise prompt that decayed under self-training (rationale compliance 59% to 40%); v1's loss was length without competence, which selection under the student's budget removes directly; no new teacher run is needed"
evidence = [
    { ref = "knowledge:202", note = "students copied the teacher's length (392 tokens per action) without its competence" },
    { ref = "knowledge:203", note = "the non-thinking rule this candidate replaces; thinking off cut train pass@1 0.263 to 0.197 and tasks ever solved 95 to 62" },
    { ref = "ledger:generic-learning#e2", note = "success: at budget B gain over v1 at least +0.05, interval above 0; non-inferior at 4B; exhaustion within 10 points of base" },
]

[[problems.candidates]]
id = "distill-transfer.family-breadth"
intervention = "curation"
statement = "E3. Vary the number of training families (4, 8, 12 rungs) at equal record count and examine on the same held-out rungs."
variable = "curate.families"
belief = 0.4
prior = "breadth of families is the lever in the procedurally generated environment literature, and A2's 47 lineages are the only recipe that transferred; not measured here at fixed record count"
evidence = [
    { ref = "ledger:generic-learning#e3", note = "success: monotone, 12 minus 4 at least +0.05 with interval above 0; decides environment factory against algorithms" },
]

# ---------------------------------------------------------------------------

[[problems]]
id = "4b-data"
statement = "The 4B's own verified data is small: 85 concise records from 168 x 5 attempts, 62 of the 168 train tasks solved."
metric = "train-task-coverage"
evidence = [
    { ref = "knowledge:198", note = "the base passes a quarter of the vim practice tasks" },
    { ref = "result:item24b-gen0", note = "168 x 15 concise: pass@1 0.197, 62 tasks solved" },
]

[[problems.candidates]]
id = "4b-data.expert-iteration"
intervention = "expert-iteration"
statement = "Train generation n on the cumulative verified passes of generations 0 to n-1 and harvest again."
variable = "rollout.attempts"
belief = 0.5
prior = "uninformed before item 24b"

[[problems.candidates]]
id = "4b-data.more-samples"
intervention = "curation"
statement = "Sample more attempts per train task (168 x 15 instead of x 5)."
variable = "rollout.attempts"
belief = 0.5
prior = "the x 15 harvest gave 497 passes against 85 records at x 5, but its coverage gain was not measured separately"

[[problems.candidates]]
id = "4b-data.star-hinted"
intervention = "star"
statement = "Rationalise failed train tasks with the reference solution as a hint, keeping attempts that pass item 24's four filters."
variable = "curate.rationalise"
belief = 0.5
prior = "uninformed before the feasibility gates"
evidence = [
    { ref = "knowledge:200", note = "pre-registered leak and observation filters reject nearly all unhinted vim passes" },
]

[[problems.candidates]]
id = "4b-data.star-concise"
intervention = "star"
statement = "Rationalise in the concise mode with the content-only filter (item 24c)."
variable = "curate.rationalise"
belief = 0.2
prior = "gate c (exploratory, not pre-registered) first kept 81 of 96; with the answer check fixed it keeps 5 of 96 (5.2%), under the 10% bar, so item 24c's basis is gone"
evidence = [
    { ref = "knowledge:201", note = "gate c, corrected to 5 of 96" },
    { ref = "commit:fc0ce7443", note = "the answer check finds hint commands written before a reply showed them" },
]

[[problems.candidates]]
id = "4b-data.rewrite-pass"
intervention = "star"
statement = "Rewrite each kept rationalisation to present the reasoning as the model's own (item 24d)."
variable = "curate.rewrite"
belief = 0.3
prior = "planned, not pre-registered; the rewrite may degrade the reasoning it rewrites"

[[problems.candidates]]
id = "4b-data.path-guided-resampling"
intervention = "star"
statement = "E4. For tasks the champion never solves, replay a verified path's states, fork the student without the hint at each state, keep verified unhinted suffixes and train on the suffix only; the control adds an equal count of extra teacher records."
variable = "curate.resample_from_path"
belief = 0.35
prior = "needs no prose filter (the hint is never in context), which removes the defect of knowledge 200 and 201; yield on never-solved tasks is unmeasured and the arm waits on E1 showing that the instrument detects +0.05"
evidence = [
    { ref = "knowledge:200", note = "pre-registered prose filters rejected nearly all unhinted vim passes" },
    { ref = "knowledge:201", note = "the answer check was vacuous, then defective, on vim" },
    { ref = "ledger:generic-learning#e4", note = "success: yield at least 30% of never-solved tasks; from-scratch pass@4 +0.10; held-out families +0.05 over control; retention non-inferior at 0.10" },
]

# ---------------------------------------------------------------------------

[[problems]]
id = "trajectory-credit"
statement = "Teacher-free RL with trajectory-level credit on a few hundred tasks sharpened the practised tasks only: train up, held-out and retention down."
metric = "pass@1"
evidence = [
    { ref = "knowledge:204", note = "R19: train +0.064, held-out -0.016, retention -0.077" },
    { ref = "ledger:generic-learning", note = "2026-11-21 training-methods review: step credit from branch outcomes is untried here" },
]

[[problems.candidates]]
id = "trajectory-credit.branch-value-pairs"
intervention = "rl-round"
statement = "E5. On tasks with 0 < p < 1, estimate V(s_t) by forked continuations, find the decisive step by binary search, and train on shared-prefix pairs at that step; the control is rejection fine-tuning at equal rollout tokens."
variable = "train.credit"
belief = 0.3
prior = "the review's own prior is about 0.3: step credit by branch outcome is published (Math-Shepherd, VinePPO) but at larger scale, and nothing of the kind exists here; forks and prefix caching (87% hit rate) make it affordable"
evidence = [
    { ref = "knowledge:204", note = "trajectory-level credit gave train-only gains" },
    { ref = "ledger:generic-learning#e5", note = "success: held-out +0.05 over the RFT control with interval above 0; retention non-inferior" },
]
