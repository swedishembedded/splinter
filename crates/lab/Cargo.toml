[package]
name = "splinter-lab"
description = "Splinter's laboratory harness for learning runs: task packages, information boundary, served-model identity, and measurement."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sven-sdk = { workspace = true }
splinter-sandbox = { workspace = true }
splinter-record = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
