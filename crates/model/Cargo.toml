[package]
name = "splinter-model"
description = "The model Splinter trains, reached through brain's API: served inference behind sven's provider seam, model selection, training jobs, dataset checks and held-out scoring. The only crate that reaches brain."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
splinter-core = { workspace = true }
splinter-eval = { workspace = true }
splinter-data = { workspace = true }
sven-sdk = { workspace = true }
brain = { workspace = true }
brain-survival = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Its own specs use the checkpoint fixture (`fixture`).
splinter-model = { workspace = true, features = ["scripted"] }
splinter-store = { workspace = true }
tempfile = { workspace = true }

[features]
# The scripted base loader (`residency::scripted`): specs above this crate
# exercise residency with it where no weights are available.
scripted = []

[lints]
workspace = true
