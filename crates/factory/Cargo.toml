[package]
name = "splinter-factory"
description = "The learning factory: a recipe planned into a graph of reusable stages (tasks, rollouts, datasets, training, evaluation, release) and carried out by one durable controller."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atif = { workspace = true }
splinter-core = { workspace = true }
splinter-data = { workspace = true }
splinter-eval = { workspace = true }
splinter-model = { workspace = true }
splinter-store = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
splinter-eval = { workspace = true }
splinter-model = { workspace = true, features = ["scripted"] }

[lints]
workspace = true
