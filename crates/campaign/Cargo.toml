[package]
name = "splinter-campaign"
description = "Splinter's controller: configuration, model references, the front door, and each pipeline stage - sources, tasks, solve, verify, critique, dataset, train, release - with learn composing them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
splinter-core = { workspace = true }
splinter-agent = { workspace = true }
splinter-knowledge = { workspace = true }
splinter-lab = { workspace = true }
splinter-policy = { workspace = true }
splinter-sandbox = { workspace = true }
splinter-record = { workspace = true }
splinter-views = { workspace = true }
sven-sdk = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# The scripted base loader: the residency specs run without weights.
splinter-policy = { workspace = true, features = ["scripted"] }
anyhow = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
