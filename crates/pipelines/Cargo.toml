[package]
name = "splinter-pipelines"
description = "Splinter's stages and pipelines: the front door, and each stage - sources, tasks, solve, verify, critique, dataset, train, release - with learn composing them as a pipeline."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
splinter-core = { workspace = true }
splinter-orchestrator = { workspace = true }
splinter-agent = { workspace = true }
splinter-knowledge = { workspace = true }
splinter-eval = { workspace = true }
splinter-model = { workspace = true }
splinter-sandbox = { workspace = true }
splinter-store = { workspace = true }
splinter-data = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
sven-sdk = { workspace = true }
atif = { workspace = true }
tempfile = { workspace = true }
# The scripted base loader: the residency specs run without weights.
splinter-model = { workspace = true, features = ["scripted"] }
anyhow = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
